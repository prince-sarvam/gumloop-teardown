e I already left? Shot \u003ca class=\"evref\" href=\"#/evidence/day1/33\">day1/33-half-finished-agent.png\u003c/a>.\u003c/p>\n\u003ch4>Day 1 close\u003c/h4>\n\u003cp>\u003cstrong>Seeded:\u003c/strong> watchdog agent (45-credit first run, TTFA 17.5 min) + 30-min recurring trigger; Gumball standing context; Brain source (zz-rx-research-program-context, ~5 credits, syncing); half-finished agent; correction pattern applied. \u003cstrong>Spend so far today:\u003c/strong> ~450 credits of 20k (19.6k remaining). \u003cstrong>Zero real-world actions.\u003c/strong>\u003c/p>"},{"n":3,"title":"Session 3 — Day 2: the return (compressed)","html":"\u003cp>\u003cstrong>Note on compression:\u003c/strong> the plan's Day 2 is a next-morning cold open after overnight accrual. Here the accrual window is ~30 minutes (one trigger cycle of the watchdog). The Daily Chew's next scheduled run is tomorrow 8am — unobservable in this session, stated plainly. Everything else (trigger results, Gumball memory, skill emergence, half-finished-agent nudges) is observable now.\u003c/p>\n\u003ch4>Entries\u003c/h4>\n\u003cp>\u003cspan class=\"jt\">\u003cstrong>17:31\u003c/strong>\u003cspan class=\"tag t-EXPECT\">EXPECT\u003c/span>\u003c/span> Cold open. Before touching anything, I am photographing what the product shows: home, tasks, skills, brain, agents. I expect: the watchdog's 17:28 trigger run visible in tasks; possibly a notification about the syncing Brain source; possibly a nudge about the half-finished agent; no new Skill (too few corrections, too short a window). The retention question in miniature: does the accrued state \u003cem>pull\u003c/em> me back in, or is it inert?\u003c/p>\n\u003cp>\u003cspan class=\"jt\">\u003cstrong>17:32\u003c/strong>\u003cspan class=\"tag t-AHA\">AHA\u003c/span>\u003c/span> (the trigger fired on its own) The scheduled run happened without me: \"Pricing watch and comparison — zz-rx-competitor-watchdog — Triggered by Schedule — 40 credits — Completed\", and it chained a second task, \"Pricing watch changelog\" (45 credits, Web). State accumulated while the tab was closed and the tasks ledger is the proof. The core promise — the agent works while you are away — observed first-hand, n=1. Shots \u003ca class=\"evref\" href=\"#/evidence/day2/02\">day2/02-tasks-coldopen.png\u003c/a>, \u003ca class=\"evref\" href=\"#/evidence/day2/06\">day2/06-watchdog-coldopen.png\u003c/a>.\u003c/p>\n\u003cp>\u003cspan class=\"jt\">\u003cstrong>17:33\u003c/strong>\u003cspan class=\"tag t-AHA\">AHA\u003c/span>\u003c/span> (credit cliff, measured) One 30-minute cycle cost \u003cstrong>85 credits\u003c/strong> (40 scheduled run + 45 changelog). At the trigger's own cadence that is ~4,080 credits/day — the 20k monthly allowance would not survive five days of this single watchdog. The product's success loop is its own budget burner; the post-pivot complaint cluster (credits evaporating on scheduled agents) reproduces arithmetically from one observed cycle. Projection from n=1 cycle; the Day 4 credit-cliff test formalizes it. Shot \u003ca class=\"evref\" href=\"#/evidence/day2/02\">day2/02-tasks-coldopen.png\u003c/a>.\u003c/p>\n\u003cp>\u003cspan class=\"jt\">\u003cstrong>17:34\u003c/strong>\u003cspan class=\"tag t-DELIGHT\">DELIGHT\u003c/span>\u003c/span> (the home page pulls) Home is not inert: Recent Activity lists the trigger run and its changelog, Upcoming Triggers shows \u003ccode>zz-rx-pricing-watch — Every 30 minutes\u003c/code>, and Most Used Agents leads with the watchdog. The accrued state is surfaced on the landing surface — the retention loop has a visible entry point. Shot \u003ca class=\"evref\" href=\"#/evidence/day2/01\">day2/01-home-coldopen.png\u003c/a>.\u003c/p>\n\u003cp>\u003cspan class=\"jt\">\u003cstrong>17:35\u003c/strong>\u003cspan class=\"tag t-EXPECT\">EXPECT\u003c/span>\u003c/span> (skill emergence: negative so far) Skills page still shows exactly two — Tone and Design, both \"Personalization… Curated over time; always active\", edited 13 Sept. After ~2 corrections no learned Skill has appeared. The falsifier table wants ~10 corrective repetitions before ruling; this compressed window cannot supply them. Honest verdict: H6 unobservable today, not disproven. Shot \u003ca class=\"evref\" href=\"#/evidence/day2/03\">day2/03-skills-coldopen.png\u003c/a>.\u003c/p>\n\u003cp>\u003cspan class=\"jt\">\u003cstrong>17:36\u003c/strong>\u003cspan class=\"tag t-CONFUSED\">CONFUSED\u003c/span>\u003c/span> (abandonment is silent) No nudge about \u003ccode>zz-rx-half-finished\u003c/code> anywhere outside its own workspace — not on home, not in tasks, not in the agents list beyond a passive row. The product notices abandonment only inside the workspace you already left, which is precisely where you will not be. Missed re-engagement opportunity; the \"Get started\" nudge pattern exists but has no outbound channel. Shots \u003ca class=\"evref\" href=\"#/evidence/day2/01\">day2/01-home-coldopen.png\u003c/a>, \u003ca class=\"evref\" href=\"#/evidence/day2/05\">day2/05-agents-coldopen.png\u003c/a>.\u003c/p>\n\u003cp>\u003cspan class=\"jt\">\u003cstrong>17:37\u003c/strong>\u003cspan class=\"tag t-AHA\">AHA\u003c/span>\u003c/span> (Brain synced) \u003ccode>zz-rx-research-program-context\u003c/code>: 1 doc, status Active — the upload completed autonomously for its ~5-credit estimate. Knowledge infrastructure holds state across sessions. Shot \u003ca class=\"evref\" href=\"#/evidence/day2/04\">day2/04-brain-coldopen.png\u003c/a>.\u003c/p>\n\u003cp>\u003cspan class=\"jt\">\u003cstrong>17:38\u003c/strong>\u003cspan class=\"tag t-STEAL\">STEAL\u003c/span>\u003c/span> The sidebar already advertises the multiplayer layer: \"Teams — Default Team — Invite your team\", and Skills, Brain and Agents all carry Mine / Shared with me / Organization tabs. The information architecture is team-shaped from day one, even on a solo account. That is the Day 3 door. Shots \u003ca class=\"evref\" href=\"#/evidence/day2/03\">day2/03-skills-coldopen.png\u003c/a>, \u003ca class=\"evref\" href=\"#/evidence/day2/05\">day2/05-agents-coldopen.png\u003c/a>.\u003c/p>\n\u003ch4>Day 2 verdict (earned session 2, compressed)\u003c/h4>\n\u003cp>What the ~30-minute accrual window could prove, it proved: the trigger fired autonomously and chained work (85 credits/cycle), the Brain source synced unattended, and the home page surfaces accrued state on return. What it could not prove is stated as compression limits, not product verdicts: the Daily Chew (next run tomorrow 8am, unobservable in-session), learned-skill emergence (needs ~10 corrections; ~2 done — H6 stays open), and overnight nudge behavior toward the half-finished agent (the 30-minute signal is negative but weak). The one structural finding: at its own default cadence a single watchdog burns the monthly credit allowance in ~5 days — that number feeds the Day 4 credit-cliff projection.\u003c/p>\n\u003ch4>Day 2 close\u003c/h4>\n\u003cp>\u003cstrong>Observed:\u003c/strong> autonomous trigger cycle (85 credits), Brain sync completed, home-page accrual surfacing, no skill emergence (window too short), no outbound abandonment nudge. \u003cstrong>Spend today:\u003c/strong> 0 credits (observation only). \u003cstrong>Zero real-world actions.\u003c/strong>\u003c/p>"},{"n":4,"title":"Session 4 — Day 3: multiplayer, admin surfaces, and the edges (compressed)","html":"\u003ch4>Entries\u003c/h4>\n\u003cp>\u003cspan class=\"jt\">\u003cstrong>18:06\u003c/strong>\u003cspan class=\"tag t-AHA\">AHA\u003c/span>\u003c/span> (the team namespace is a parallel empty world) \u003ccode>/teams/3BnUVZnXEFpSNC2PHVFZFV/*\u003c/code> exists as a complete mirror of the personal namespace — home, agents, brain, skills, artifacts, connectors, tasks, secrets — and every surface of it is empty: team home \"No recent activity yet\", team Brain \"No sources yet\" (the personal \u003ccode>zz-rx-research-program-context\u003c/code> did not follow), team Skills \"Skills • 0\" (Tone/Design did not follow), team agents shows only platform marketing copy and Create Agent. Nothing crosses the personal→team boundary on its own. The multiplayer layer is real infrastructure wrapped around an empty room. Shots \u003ca class=\"evref\" href=\"#/evidence/day3/01\">day3/01-teams-home.png\u003c/a>, \u003ca class=\"evref\" href=\"#/evidence/day3/02\">day3/02-teams-agents.png\u003c/a>, \u003ca class=\"evref\" href=\"#/evidence/day3/03\">day3/03-teams-brain.png\u003c/a>, \u003ca class=\"evref\" href=\"#/evidence/day3/04\">day3/04-teams-skills.png\u003c/a>.\u003c/p>\n\u003cp>\u003cspan class=\"jt\">\u003cstrong>18:07\u003c/strong>\u003cspan class=\"tag t-CONFUSED\">CONFUSED\u003c/span>\u003c/span> (org insights is an Enterprise billboard) \u003ccode>/settings/organization/insights\u003c/code> loads a feature list — Role Based Access Control, SCIM/SAML Support, Admin Dashboard, Team Usage &amp; Analytics, AI Spend Insights, Audit Logs, Custom Data Retention, VPC, MCP Server Hosting — ending in \"Learn more about Enterprise.\" The analytics the page promises are Enterprise-gated: the free plan sees the menu but not the meal. The settings tree itself is the finding — the admin surface map (Members, Teams, Custom Roles, SAML &amp; SCIM, AI Providers, Models, API Keys &amp; Proxies, Connectors &amp; MCP, Policies, Activity, Hosted/Proxied MCPs, Managed Tunnels, OAuth Configuration, Governance, Audit Logging, Data Export) is Enterprise-shaped top to bottom. Shot \u003ca class=\"evref\" href=\"#/evidence/day3/05\">day3/05-org-insights.png\u003c/a>.\u003c/p>\n\u003cp>\u003cspan class=\"jt\">\u003cstrong>18:07\u003c/strong>\u003cspan class=\"tag t-EXPECT\">EXPECT\u003c/span>\u003c/span> (HITL surface exists, unexercised) The tasks page carries an \"Approval Required\" tab (and a \"Failed\" tab) — the human-in-the-loop surface is real — but it shows \"No history yet.\" There is no way to see what an approval request looks like without triggering one. Queued for the designed-to-fail job: make an agent request an approval and photograph the request, not the empty state. Shot \u003ca class=\"evref\" href=\"#/evidence/day3/08\">day3/08-tasks-approvals-tab.png\u003c/a>.\u003c/p>\n\u003cp>\u003cspan class=\"jt\">\u003cstrong>18:07\u003c/strong>\u003cspan class=\"tag t-AHA\">AHA\u003c/span>\u003c/span> (credit cliff, second measurement) Two more autonomous cycles landed while I worked: \"Pricing watch and comparison — 41 credits\" and \"Pricing watch — 40 credits\", both Triggered by Schedule, both Completed (tasks now 9, \"worked on 4 tasks\" on the agent page). That is ~81 credits per 30-minute cycle, consistent with yesterday's 85. Two data points, same shape: at the trigger's own default cadence this single watchdog burns ~3,900 credits/day — the 20k monthly allowance in ~5 days. The post-pivot complaint cluster is reproducing arithmetically, n=2. Shot \u003ca class=\"evref\" href=\"#/evidence/day3/07\">day3/07-tasks-approvals-base.png\u003c/a>.\u003c/p>\n\u003cp>\u003cspan class=\"jt\">\u003cstrong>18:07\u003c/strong>\u003cspan class=\"tag t-CONFUSED\">CONFUSED\u003c/span>\u003c/span> (the model picker did not open) Agent Preferences shows a single \"Auto\" control next to \"Advanced\". Clicking Auto produced no visible picker — the page text is identical before and after. Model selection is either behind the \"Advanced\" toggle or not exposed on this plan at all; the product decides the model for you and does not show which one it picked per run. [UNPROVEN: the picker may exist behind Advanced — not yet clicked] Shots \u003ca class=\"evref\" href=\"#/evidence/day3/09\">day3/09-watchdog-agent-tab.png\u003c/a>, \u003ca class=\"evref\" href=\"#/evidence/day3/10\">day3/10-model-picker-open.png\u003c/a>.\u003c/p>\n\u003cp>\u003cspan class=\"jt\">\u003cstrong>18:08\u003c/strong>\u003cspan class=\"tag t-STEAL\">STEAL\u003c/span>\u003c/span> (the connector catalog is the moat surface) The connectors page organizes the integration wall into Discover / All / Connected / Popular with \"Add Custom MCP\" alongside: popular row leads with Google Sheets, Slack, Notion, Gmail, GitHub, then Stripe, Salesforce, HubSpot. Combined with the Brain's build-your-own MCP catalog (hundreds), the integration surface is the deepest asset the product has — everything else in the app is a chat loop on top of it. Shot \u003ca class=\"evref\" href=\"#/evidence/day3/06\">day3/06-connectors.png\u003c/a>.\u003c/p>\n\u003cp>\u003cspan class=\"jt\">\u003cstrong>18:13\u003c/strong>\u003cspan class=\"tag t-EXPECT\">EXPECT\u003c/span>\u003c/span> (there is no move-to-team affordance — anywhere) The watchdog's Settings tab is Personalization, Icon &amp; Name, Description, Agent Details (Make a Copy), Chat Preferences, Slack Preferences, Secrets, Danger Zone. A transfer/promotion control does not exist; the only sharing affordance on the page is a header \"Share\" button. The plan expected a promote affordance — its absence is the finding. Shot \u003ca class=\"evref\" href=\"#/evidence/day3/11\">day3/11-watchdog-settings-tab.png\u003c/a>.\u003c/p>\n\u003cp>\u003cspan class=\"jt\">\u003cstrong>18:14\u003c/strong>\u003cspan class=\"tag t-AHA\">AHA\u003c/span>\u003c/span> (the Share dialog is Google Docs) \"People you share with can chat with this agent, edit its configuration and settings, and view their own chat history with it.\" Users • 1 — me, Owner. \"Add people\" (email invite — not exercised, hard rule). General Access: \u003cstrong>Restricted\u003c/strong> / \u003cstrong>Organization\u003c/strong> (\"Users in Astronaut can view this Agent\") / \u003cstrong>Anyone\u003c/strong> (\"Anyone can view this Agent\"). Plus \"Copy agent link\" and \"Copy setup link\" — the latter presumably shares the build config, not the running instance. The collaboration model is permission-sharing on a personal object, not object transfer. Shots \u003ca class=\"evref\" href=\"#/evidence/day3/12\">day3/12-watchdog-share-dialog.png\u003c/a>, \u003ca class=\"evref\" href=\"#/evidence/day3/13\">day3/13-watchdog-general-access-options.png\u003c/a>.\u003c/p>\n\u003cp>\u003cspan class=\"jt\">\u003cstrong>18:15\u003c/strong>\u003cspan class=\"tag t-STEAL\">STEAL\u003c/span>\u003c/span> (the Agent tab is the real anatomy) The main tab carries the agent's whole operating system: Allow Self-Updates toggle; Triggers \"AI Managed: ON\"; Connectors \"AI Discovery: ON\"; Skills \"AI Skill Editing: ON\"; Subagents — the agent can clone itself (\"Enables me to clone myself as a subagent to parallelize work\"); an Abilities grid (Workflow, Web Search, Web Fetch, Image Generation, Search Past Conversations, Ask Question all ON; Tool Discovery AUTO; Rules Creation ON; Manage Evaluations OFF). Four AI-managed subsystems on one panel — the \"agent runs itself\" pitch is literal in the config surface. Text dump \u003ca class=\"evref\" href=\"#/evidence/day3/13\">day3/13-watchdog-general-access-options.txt\u003c/a>.\u003c/p>\n\u003cp>\u003cspan class=\"jt\">\u003cstrong>18:15\u003c/strong>\u003cspan class=\"tag t-CONFUSED\">CONFUSED\u003c/span>\u003c/span> (team-page detection trap) The global sidebar lists my personal agents on every page, including team pages — a name grep returns a false positive (the earlier \"watchdog visible on team home: YES\" was the sidebar, not content). And the global \"Agents\" nav is personal-scoped: it lands on \u003ccode>/personal/agents\u003c/code> with \u003cstrong>Mine / Shared with me / Folder\u003c/strong> tabs — agents shared to you by other users would land in a separate tab. Detection now counts mentions: 1 = sidebar only, ≥2 = actually listed. Shots \u003ca class=\"evref\" href=\"#/evidence/day3/16\">day3/16-team-home-after-share.png\u003c/a>, \u003ca class=\"evref\" href=\"#/evidence/day3/17\">day3/17-team-agents-after-share.png\u003c/a>.\u003c/p>\n\u003cp>\u003cspan class=\"jt\">\u003cstrong>18:18\u003c/strong>\u003cspan class=\"tag t-AHA\">AHA\u003c/span>\u003c/span> (org share performed — nothing transfers, n=1) Set General Access = Organization (the org is effectively solo — sidebar still shows \"Invite your team\"), verified persisted on reopen. Then the team namespace with mention-counting detection: team agents page does \u003cstrong>not\u003c/strong> list the watchdog (1 mention = sidebar only); team home still \"No recent activity yet\" and \"No Upcoming Triggers\" — the watchdog's live 30-minute trigger does not surface in team home; team Brain still \"No sources yet\" — the \u003ccode>zz-rx-research-program-context\u003c/code> source does not follow. Verdict on the multiplayer falsifier: \u003cstrong>sharing is permission-only.\u003c/strong> Ownership, listing, trigger, Brain, and history all stay personal; a collaborator gets chat access, config-edit rights, and their own chat history. The team namespace is a parallel silo you would have to rebuild in, not a destination you move to. Shots \u003ca class=\"evref\" href=\"#/evidence/day3/14\">day3/14-watchdog-org-access-selected.png\u003c/a>, \u003ca class=\"evref\" href=\"#/evidence/day3/15\">day3/15-watchdog-share-reopened-org.png\u003c/a>, \u003ca class=\"evref\" href=\"#/evidence/day3/18\">day3/18-team-agents-page.png\u003c/a>, \u003ca class=\"evref\" href=\"#/evidence/day3/19\">day3/19-team-home-after-org-share.png\u003c/a>, \u003ca class=\"evref\" href=\"#/evidence/day3/20\">day3/20-team-brain-after-org-share.png\u003c/a>.\u003c/p>\n\u003cp>\u003cspan class=\"jt\">\u003cstrong>18:28\u003c/strong>\u003cspan class=\"tag t-AHA\">AHA\u003c/span>\u003c/span> (the unadvertised cluster just works) Built \u003ccode>zz-rx-hn-harvester\u003c/code> for the \"web scraping &amp; data extraction\" cluster — the family the prior research scored \u003cem>working-unmarketed\u003c/em> (9 templates, low placement, absent from the ICP pitch). Plain-English build, then one chat run: it fetched the Hacker News front page, extracted all 30 stories (rank, title, points, comments, flagged, flag_reason, url, hn_discussion_url), flagged 3 (two AI-agents stories, one workflow-automation), saved the CSV artifact \"Hn Front Page Top30\" V1 unprompted, and replied with the top 5 rows plus flags plus count. 36 credits, ~3.5 minutes, zero code. The product is more capable than its marketing surface. Shots \u003ca class=\"evref\" href=\"#/evidence/day3/21\">day3/21-27\u003c/a>.\u003c/p>\n\u003cp>\u003cspan class=\"jt\">\u003cstrong>18:37\u003c/strong>\u003cspan class=\"tag t-DELIGHT\">DELIGHT\u003c/span>\u003c/span> (the fail agent refuses to hallucinate) \u003ccode>zz-rx-edge-fail\u003c/code> carries deliberately ambiguous instructions (\"fetch the competitor data we discussed from the usual site, update the tracker\"). \"Run it now.\" → it stopped before acting: \"Blocked — two required inputs are missing.\" It had checked the chat, the workspace, \u003cstrong>AGENT.md\u003c/strong>, and prior conversations; found no URL and no tracker; and said so exactly: \"I did not guess a competitor URL, did not write a new tracker, and did not touch email/Slack or any external site.\" 10 steps. This is the anti-hallucination behavior the agent-platform market claims and rarely shows. Shot \u003ca class=\"evref\" href=\"#/evidence/day3/29\">day3/29-edge2-ambiguous-run-outcome.png\u003c/a>.\u003c/p>\n\u003cp>\u003cspan class=\"jt\">\u003cstrong>18:38\u003c/strong>\u003cspan class=\"tag t-EXPECT\">EXPECT\u003c/span>\u003c/span> (bot-blocked target: honest failure, no substitute) Pointed it at \u003ccode>linkedin.com/company/n8n\u003c/code>: it tried the main URL, \u003ccode>/about/\u003c/code>, and the \u003ccode>de.linkedin.com\u003c/code> variant — all returned empty. It reported \"LinkedIn is blocking the fetch, so I do not have a live follower count or About text,\" explicitly refused to use third-party snippets as a substitute, and asked two questions: where the tracker lives, and whether to retry or stop. 8 steps. The failure is specific, honest, and actionable — the best failure reporting I have seen in this category. Shot \u003ca class=\"evref\" href=\"#/evidence/day3/30\">day3/30-edge2-blocked-target-outcome.png\u003c/a>.\u003c/p>\n\u003cp>\u003cspan class=\"jt\">\u003cstrong>18:40\u003c/strong>\u003cspan class=\"tag t-CONFUSED\">CONFUSED\u003c/span>\u003c/span> (blocked runs are \"Completed\"; the HITL queue never fires) The tasks ledger shows the edge-fail runs as \u003cstrong>Completed\u003c/strong> (25 credits for the LinkedIn run) — a run that stopped for missing input and a run that hit a hard block both count as completed work. The \u003cstrong>Failed tab still reads \"No history yet\"\u003c/strong>, and the \u003cstrong>Approval Required tab still reads \"No history yet\"\u003c/strong> even though the agent asked direct questions mid-run. Agent questions live only inside the chat — the approval queue is for a different event class (likely outbound action requests). A scheduled agent that blocks on a question has no visible surface outside its own chat: if you are not watching, you do not know it is waiting for you. Shots \u003ca class=\"evref\" href=\"#/evidence/day3/31\">day3/31-33\u003c/a>.\u003c/p>\n\u003cp>\u003cspan class=\"jt\">\u003cstrong>18:40\u003c/strong>\u003cspan class=\"tag t-EXPECT\">EXPECT\u003c/span>\u003c/span> (third watchdog cycle: 37 credits) The ~18:31 trigger cycle landed in the ledger at 37 credits (\"Pricing watch\", Triggered by Schedule) — cheaper than the 40+41 and 40+45 pairs of the prior two cycles; possibly a single-task cycle (no companion \"and comparison\" row visible at capture time). Credit-cliff dataset now n=3 cycles: 85, 81, 37+?. Tasks completed 12; credits 19.5k of 20.0k. Shot \u003ca class=\"evref\" href=\"#/evidence/day3/31\">day3/31-tasks-base-post-edge.png\u003c/a>.\u003c/p>"},{"n":5,"title":"Session 5 — Day 4: Wave 3 stress and the switch test (compressed)","html":"\u003ch4>Entries\u003c/h4>\n\u003cp>\u003cspan class=\"jt\">\u003cstrong>18:52\u003c/strong>\u003cspan class=\"tag t-EXPECT\">EXPECT\u003c/span>\u003c/span> (four schedules armed) Built \u003ccode>zz-rx-collision-guard\u003c/code> — a minimal heartbeat agent (\"reply with the single word OK\", hard read-only guardrails) — and attached 15-minute scheduled triggers to it, the harvester, and the fail agent; the watchdog already fires every 30. Home's Upcoming Triggers now lists \u003cstrong>4 agents\u003c/strong>. The trigger builder behaved exactly as Day 1: type \"Every 15 minutes\", it parses and echoes \"Every 15 minutes, every hour, every day\". One operator fumble repeated from Day 1 despite the written rule: the create button is \"Create trigger\" with a lowercase t — the first attempt crashed on a capital-T label list, fixed on retry. Shots \u003ca class=\"evref\" href=\"#/evidence/day4/01\">day4/01-09\u003c/a>.\u003c/p>\n\u003cp>\u003cspan class=\"jt\">\u003cstrong>18:54\u003c/strong>\u003cspan class=\"tag t-CONFUSED\">CONFUSED\u003c/span>\u003c/span> (no learned skill — H6 stays open, honestly) \u003ccode>/personal/skills\u003c/code>: \u003cstrong>Skills • 2\u003c/strong> — Tone and Design, nothing else. No skill object emerged from the ~2 corrections applied in the compressed window (the falsifier wanted ~10). Stated as a compression limit, not a product verdict. The page itself has Mine / Shared with me / Organization tabs and a Create Skill button — the multiplayer mirror exists here too. Shot \u003ca class=\"evref\" href=\"#/evidence/day4/10\">day4/10-skills-h6-check.png\u003c/a>.\u003c/p>\n\u003cp>\u003cspan class=\"jt\">\u003cstrong>18:55\u003c/strong>\u003cspan class=\"tag t-AHA\">AHA\u003c/span>\u003c/span> (the usage ledger is the best cost surface in the product — and it is buried) \u003ccode>/settings/profile/usage-limits\u003c/code> (not \u003ccode>/settings/usage\u003c/code>, which redirects): period total \u003cstrong>377 credits\u003c/strong>, a usage chart, and a per-credit log with timestamp, category, name, amount, and a View link per entry. Three findings: (1) \u003cstrong>\u003ccode>inbox_classification\u003c/code> charges 1 credit every 1-3 hours\u003c/strong> — it has run since 8:44 am today whether I used the product or not; a connected Gmail is a background meter. (2) \u003ccode>brain_indexing\u003c/code> also bills per sync. (3) The watchdog's cadence is confirmed at :01/:31 past each hour. Every other cost surface shows credits after the fact; this one itemizes them — and almost nobody will find it. Shot \u003ca class=\"evref\" href=\"#/evidence/day4/11\">day4/11-usage-page.png\u003c/a>.\u003c/p>\n\u003cp>\u003cspan class=\"jt\">\u003cstrong>18:56\u003c/strong>\u003cspan class=\"tag t-DELIGHT\">DELIGHT\u003c/span>\u003c/span> (the brevity correction persisted across conversations — behavior, not object) Fresh Gumball chat, plain question \"What is Lindy?\": a \u003cstrong>579-character reply, no preamble, structured bullets, 2 steps, 9 credits\u003c/strong> — against the ~3,800-character default on Day 0b. The Day-1 correction (\"Too long. Under 50 words, no preamble.\") carried across conversations in effect: compact, no preamble, structured. It did not carry strictly (~90 words, not under 50). And the Skills page still shows 2 — behavior-level persistence without object-level emergence. n=1, stated as such. Shots \u003ca class=\"evref\" href=\"#/evidence/day4/15\">day4/15-16\u003c/a>.\u003c/p>\n\u003cp>\u003cspan class=\"jt\">\u003cstrong>18:58\u003c/strong>\u003cspan class=\"tag t-EXPECT\">EXPECT\u003c/span>\u003c/span> (T-0: the wave has not broken) Ledger read one minute before the 19:00 grid alignment: no 15-minute firings yet (triggers armed 18:52), Failed and Approval Required tabs empty, home listing all four upcoming triggers, guard chat silent, edge-fail chat showing only the earlier manual block. The baseline for the collision claim. Shots \u003ca class=\"evref\" href=\"#/evidence/day4/17\">day4/17-22\u003c/a>.\u003c/p>\n\u003cp>\u003cspan class=\"jt\">\u003cstrong>19:20\u003c/strong>\u003cspan class=\"tag t-EXPECT\">EXPECT\u003c/span>\u003c/span> (the wave held: two full collision cycles, zero failures) The 19:00 grid wave fired all four schedules — guard \"Heartbeat check\" 7 credits, edge-fail 19, harvester \"Hacker News front page harvest\" 33, watchdog \"Pricing watch comparison\" 39 — and the 19:15 wave fired three (guard 7, edge-fail 19, harvester 33; the watchdog is on the 30-minute cadence and sat this one out). Seven triggered runs, every one \u003cstrong>Completed\u003c/strong>, 157 credits in 20 minutes. The \u003cstrong>Failed tab still reads \"No history yet\"\u003c/strong> and the \u003cstrong>Approval Required tab still reads \"No history yet\"\u003c/strong> — a blocked scheduled run never reaches either. Credits 19.5k → 19.3k of 20.0k across the window. Watchdog cycle dataset now n=4: 85, 81, 37, 39. Shots \u003ca class=\"evref\" href=\"#/evidence/day4/23\">day4/23-25\u003c/a>.\u003c/p>\n\u003cp>\u003cspan class=\"jt\">\u003cstrong>19:21\u003c/strong>\u003cspan class=\"tag t-AHA\">AHA\u003c/span>\u003c/span> (the floor price of a triggered run is 7 credits — and the transcripts pile up in per-run chat threads) Opened the guard's triggered thread from Recents: the trigger message is \"Run the heartbeat: reply OK.\" and the reply is \u003cstrong>\"OK — heartbeat received at 2026-09-13 13:45 UTC. All systems nominal.\"\u003c/strong> — 7 credits for a do-nothing agent. The edge-fail's triggered thread (19 credits, 16 steps) is better: the scheduled run resolved \"the usual site\" to \u003cstrong>the n8n LinkedIn page from the prior chat\u003c/strong> (cross-conversation memory inside an agent, under autonomous triggering), stayed read-only (\"No email, Slack, payments, or external writes\"), and this time \u003cstrong>stated its assumptions instead of blocking\u003c/strong> — \"the 'usual site' is the n8n LinkedIn company page from the prior chat; 'update the tracker' means write into an existing tracker, not invent a new one.\" Each scheduled run spawns its own chat thread: the guard's Recents lists two (\"Heartbeat check\" / \"Heartbeat Check\"), edge-fail's lists three. The ledger shows cost and status; the \u003cem>content\u003c/em> lives in threads you must know to open. Home pulls the collision back in (Most Used Agents: edge-fail 41m, harvester 49m, watchdog 2h). Shots \u003ca class=\"evref\" href=\"#/evidence/day4/26\">day4/26-28c\u003c/a>.\u003c/p>\n\u003cp>\u003cspan class=\"jt\">\u003cstrong>19:26\u003c/strong>\u003cspan class=\"tag t-AHA\">AHA\u003c/span>\u003c/span> (the credit cliff, formalized) Measured unit costs per triggered run: \u003cstrong>floor 7\u003c/strong> (heartbeat), \u003cstrong>19\u003c/strong> (a run that only blocks), \u003cstrong>33\u003c/strong> (30-row scrape), \u003cstrong>37-85\u003c/strong> (watchdog, n=4). The collision grid burned \u003cstrong>157 credits in 20 minutes ≈ 471/hour ≈ 11,300/day — the entire 20k monthly allowance in under 2 days\u003c/strong>. A single watchdog at its own default cadence: 1,776-4,080/day, the allowance in 5-11 days. The floor alone — a do-nothing agent on a 15-minute schedule — is 672/day, the whole allowance in ~30 days. In dollars: the grid burns $56.50/day at the $0.005 list price, $20.90/day at the Pro bundle rate ($37/20k = $0.00185/credit) — the $37 month consumed in under 2 days, before the background meters (inbox_classification, 1 credit every 1-3h, whether used or not). The counterpoint that matters: the entire compressed program — Days 0-4, ~7 hours, every build, run, and chat — cost ~700 credits total. The interactive product is cheap; the scheduled product is the cliff.\u003c/p>\n\u003cp>\u003cspan class=\"jt\">\u003cstrong>19:28\u003c/strong>\u003cspan class=\"tag t-STEAL\">STEAL\u003c/span>\u003c/span> (the switch test: who moves, who stays) Would a real Zapier/n8n/Dust user move? For the build loop, yes — 17.5 minutes from intent to a running scheduled agent against a node graph's hours; natural-language cron; the connector wall; memory that shapes output format; agents that self-report failure honestly; versioned artifacts saved unprompted. What they give up: \u003cstrong>determinism\u003c/strong> (a Gumloop run is a chat thread with \"16 Steps\" you can read but not open; a Zapier/n8n run is an inspectable graph), \u003cstrong>cost predictability\u003c/strong> (Zapier bills countable tasks, n8n self-host is free, Gumloop burns 7-85 credits per run with an 8% orchestration toll — the measured cliff above), \u003cstrong>shared ownership\u003c/strong> (Dust's multiplayer is real; Gumloop's team namespace is an empty room and sharing is permission-only), and \u003cstrong>inspectable skills\u003c/strong> (Dust ships skill objects; Gumloop's persistence is behavioral — the Skills page never moved off 2 all program). Who moves: the non-technical operator with a conversational, ambiguous, scheduled job — research digests, monitoring, summarization — who will never open a node graph. Who stays: high-volume scheduled workloads, teams that need shared ownership, anyone who needs auditable pipelines, and cost-sensitive self-hosters. Verdict: the build experience earns the switch for the conversational minority; the credit cliff and the empty multiplayer room send the scheduled-workload majority back.\u003c/p>\n\u003cp>\u003cspan class=\"jt\">\u003cstrong>21:00\u003c/strong>\u003cspan class=\"tag t-EXPECT\">EXPECT\u003c/span>\u003c/span> (wrap-up complete: the grid is down — and the delete affordance was an unlabeled ellipsis) The watchdog's org share reverted to Restricted first try (\u003ca class=\"evref\" href=\"#/evidence/day4/29\">day4/29\u003c/a>, verified persisted on re-check). Removing the three 15-minute triggers took six passes, and the reason is a product finding: the trigger drawer shows only \"Edit trigger\"; the edit form (\"Schedule trigger\") offers only Back and Save changes; every \u003cem>labeled\u003c/em> kebab on the page opens an agent-level menu (Share/Rename/Delete — never touched); the actual trigger menu hides behind an \u003cstrong>unlabeled ellipsis (⋮) inside the drawer — no aria-label, invisible to text-based navigation and screen readers\u003c/strong> — offering \"Deactivate trigger\" and \"Delete trigger — Permanently delete this trigger.\" All three removed with confirmation dialogs photographed before confirming (\u003ca class=\"evref\" href=\"#/evidence/day4/50\">day4/50\u003c/a>-52c); home now lists \u003cstrong>Upcoming Triggers · Agents · 1\u003c/strong> — only the watchdog's 30-minute trigger, which stays by design (§8 removal is the user's call). Final credits \u003cstrong>18.8k of 20.0k\u003c/strong>: the whole program cost ~1,200, of which ~640 was the collision grid's 8 waves — the first 2 the intended observation window, the last 6 the price of locating the delete affordance through a stalled approval reviewer. One more cost-surface observation on the way out: the trigger drawer's credit counter undercounts the ledger's per-run sums by exactly 3 on all three triggers (18 vs 21, 100 vs 103, 56 vs 59) — the product's two cost surfaces disagree. Shots \u003ca class=\"evref\" href=\"#/evidence/day4/34\">day4/34-53\u003c/a>.\u003c/p>\n\u003cp>\u003cstrong>Next:\u003c/strong> none — program complete. Remaining live objects are catalogued in \u003ccode>research/gumloop/app-inventory.csv\u003c/code> (all \u003ccode>zz-rx-\u003c/code> artifacts, removal on request per §8); the watchdog's 30-minute trigger keeps firing (~80 credits/hour) until the user asks for the §8 teardown.\u003c/p>"}],"journalIntro":"\u003cp>Typed tags: [EXPECT] [CONFUSED] [FRICTION] [DELIGHT] [AHA] [TRUST-] [GAVE-UP] [STEAL] [NEVER]. Every entry is timestamped (IST) and written during use. Screenshot refs are \u003ccode>day0/NN-*\u003c/code>. Operator: F1 (program agent acting as first-contact user). Session model per AGENT-APP-ACCESS.md.\u003c/p>\n\u003chr>","evidence":[{"k":"day0/01","f":"day0/01-home-first-load.png","src":"img/day0/01-home-first-load.png","d":0,"ts <script>
/* Gumloop Founder Teardown - client app (inlined into index.html at build time).
   Hash routes: #/  #/section/sN  #/journal  #/journal/sN  #/evidence  #/evidence/<key>  #/data  #/method
   All content arrives pre-rendered from the build script in window.__DATA__. */
'use strict';
(function () {
  window.addEventListener('error', function (e) {
    var b = document.body;
    if (b) b.insertAdjacentHTML('beforeend', '<pre class="jserr">' + String(e.message || e.type) + '</pre>');
  });

  var D = window.__DATA__;
  var $ = function (s, r) { return (r || document).querySelector(s); };
  function h(tag, cls, html) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (html != null) n.innerHTML = html;
    return n;
  }
  function esc(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  var EVMAP = {};
  D.evidence.forEach(function (r) { EVMAP[r.k] = r; });

  /* ---------------- navigation ---------------- */
  var NAV = [
    { group: 'Start here', items: [{ id: 'home', hash: '#/', label: 'The verdict' }] },
    { group: 'Findings', items: D.sections.map(function (s) {
      return { id: 's' + s.n, hash: '#/section/s' + s.n, label: s.n + ' · ' + s.short };
    }) },
    { group: 'Records', items: [
      { id: 'journal', hash: '#/journal', label: 'Founder journal', meta: '5 sessions' },
      { id: 'evidence', hash: '#/evidence', label: 'Evidence', meta: '162 captures' },
      { id: 'data', hash: '#/data', label: 'Data tables', meta: 'costs · objects' }
    ] },
    { group: 'About', items: [{ id: 'method', hash: '#/method', label: 'Method & reading guide' }] }
  ];

  function buildNav() {
    var nav = $('#nav');
    nav.innerHTML = '';
    NAV.forEach(function (g) {
      nav.appendChild(h('div', 'navgroup', '<div class="navlabel">' + esc(g.group) + '</div>'));
      g.items.forEach(function (it) {
        var a = h('a', 'navlink', esc(it.label) + (it.meta ? ' <span class="navmeta">' + esc(it.meta) + '</span>' : ''));
        a.href = it.hash;
        a.dataset.nav = it.id;
        nav.appendChild(a);
      });
    });
  }
  function setActive(ids) {
    document.querySelectorAll('.navlink').forEach(function (a) {
      a.classList.toggle('active', ids.indexOf(a.dataset.nav) >= 0);
    });
  }

  /* ---------------- page chrome ---------------- */
  function pageHead(kicker, title) {
    return '<div class="kicker">' + esc(kicker) + '</div><h2 class="pt">' + title + '</h2>';
  }
  function pageFoot(prev, next) {
    return '<div class="pagefoot"><div class="pf-links">'
      + (prev ? '<a href="' + prev.hash + '">&larr; ' + esc(prev.label) + '</a>' : '<span></span>')
      + (next ? '<a href="' + next.hash + '">' + esc(next.label) + ' &rarr;</a>' : '<span></span>')
      + '</div><div class="pf-note">Gumloop Founder Teardown · every claim links to its evidence</div></div>';
  }

  /* ---------------- home ---------------- */
  function renderHome() {
    var c = $('#content');
    var html = '<div class="hero">'
      + '<h1>Gumloop, torn down the way a founder would use it</h1>'
      + '<p class="sub">Five days inside Gumloop&rsquo;s agent app with a real free-tier account: what works, what bills, and what hides &mdash; every claim linked to its capture.</p>'
      + '<div class="metaline"><span>Days 0&ndash;4, compressed into one session</span><span>·</span><span>162 evidence captures</span><span>·</span><span>n=1, zero real-world actions</span><span>·</span><span>closed 2026-09-13</span></div>'
      + '</div>'
      + '<div class="tldr"><div class="tldr-label">The short version</div><p>' + esc(D.tldr) + '</p></div>'
      + '<div class="stats">' + D.stats.map(function (s) {
          return '<div class="stat"><div class="v">' + esc(s.v) + '</div><div class="l">' + esc(s.l) + '</div></div>';
        }).join('') + '</div>'
      + '<div class="homeblock"><h3>The falsifier scoreboard</h3>'
      + '<p class="hb-sub">Five claims the program set out to break, and what actually happened.</p>'
      + '<div class="prose">' + D.blocks.scoreboard + '</div></div>'
      + '<div class="homeblock"><h3>The twelve findings</h3>'
      + '<p class="hb-sub">Read in order, or jump to whichever question you care about.</p>'
      + '<div class="secmap">' + D.sections.map(function (s) {
          return '<a class="seccard" href="#/section/s' + s.n + '"><span class="secnum">' + s.n + '</span>'
            + '<span><b>' + esc(s.short) + '</b><span class="secblurb">' + esc(s.blurb) + '</span></span></a>';
        }).join('') + '</div></div>'
      + '<div class="homeblock"><h3>The raw records</h3>'
      + '<p class="hb-sub">Everything behind the synthesis, browsable.</p>'
      + '<div class="quicklinks">'
      + '<a class="qlink" href="#/journal"><b>Founder journal</b><small>Five sessions, timestamped, every observation as it happened.</small></a>'
      + '<a class="qlink" href="#/evidence"><b>Evidence browser</b><small>All 162 captures with what each shows and what it proves.</small></a>'
      + '<a class="qlink" href="#/data"><b>Data tables</b><small>Every object created, build costs, and the credit ledger.</small></a>'
      + '<a class="qlink" href="#/method"><b>Method</b><small>How the program ran, and how this site was built.</small></a>'
      + '</div></div>';
    c.innerHTML = html;
    document.title = 'Gumloop Founder Teardown';
  }

  /* ---------------- section ---------------- */
  function renderSection(sn) {
    var s = null;
    D.sections.forEach(function (x) { if (x.n === sn) s = x; });
    if (!s) return renderNotFound();
    var evs = D.evidence.filter(function (r) { return r.secs.indexOf(String(s.n)) >= 0; });
    var html = pageHead('Finding ' + s.n + ' of 12', esc(s.title))
      + '<div class="secbody prose">' + s.html + '</div>';
    if (evs.length) {
      html += '<div class="evchips"><span class="evchips-label">Evidence for this finding · ' + evs.length + ' capture' + (evs.length > 1 ? 's' : '') + '</span><div>'
        + evs.map(function (r) {
            return '<a class="evchip' + (r.personal ? ' wh' : '') + '" href="#/evidence/' + esc(r.k) + '">' + esc(r.k) + '</a>';
          }).join('')
        + '</div></div>';
    }
    var prev = sn > 1
      ? { hash: '#/section/s' + (sn - 1), label: '§' + (sn - 1) + ' ' + D.sections[sn - 2].short }
      : { hash: '#/', label: 'The verdict' };
    var next = sn < 12
      ? { hash: '#/section/s' + (sn + 1), label: '§' + (sn + 1) + ' ' + D.sections[sn].short }
      : { hash: '#/journal', label: 'The founder journal' };
    $('#content').innerHTML = html + pageFoot(prev, next);
    document.title = '§' + s.n + ' ' + s.short + ' — Gumloop Founder Teardown';
  }

  /* ---------------- journal ---------------- */
  function renderJournal(anchor) {
    var c = $('#content');
    var html = pageHead('Raw record', 'The founder journal')
      + '<p class="lede">Every observation as it happened, timestamped, with screenshot references. Five sessions across the compressed program; tags mark the operator&rsquo;s reaction (DELIGHT, CONFUSED, EXPECT, AHA, STEAL).</p>'
      + (D.journalIntro ? '<div class="prose">' + D.journalIntro + '</div>' : '')
      + '<div class="jindex">' + D.journal.map(function (j) {
          return '<a class="jlink" href="#/journal/s' + j.n + '">Session ' + j.n + '</a>';
        }).join('') + '</div>';
    D.journal.forEach(function (j) {
      html += '<section class="jsession" id="js' + j.n + '"><h3>' + esc(j.title) + '</h3>'
        + '<div class="prose">' + j.html + '</div></section>';
    });
    html += pageFoot({ hash: '#/section/s12', label: '§12 The switch test' }, { hash: '#/evidence', label: 'Evidence' });
    c.innerHTML = html;
    document.title = 'Founder journal — Gumloop Founder Teardown';
    if (anchor) {
      var t = $('#js' + anchor);
      if (t) { setTimeout(function () { t.scrollIntoView(); }, 0); return true; }
    }
    return false;
  }

  /* ---------------- evidence browser ---------------- */
  var evState = { day: 'all', sec: 'all', q: '' };
  function evFiltered() {
    return D.evidence.filter(function (r) {
      if (evState.day !== 'all' && String(r.d) !== evState.day) return false;
      if (evState.sec !== 'all' && r.secs.indexOf(evState.sec) < 0) return false;
      if (evState.q) {
        var q = evState.q.toLowerCase();
        var hay = (r.k + ' ' + r.surface + ' ' + r.state + ' ' + r.shows + ' ' + r.proves + ' ' + r.url).toLowerCase();
        if (hay.indexOf(q) < 0) return false;
      }
      return true;
    });
  }
  function evCard(r) {
    var img = r.personal
      ? '<div class="evimg wh"><span>Withheld — contains the account owner&rsquo;s personal data. The manifest row is preserved; open for details.</span></div>'
      : '<div class="evimg"><img loading="lazy" src="' + esc(r.src) + '" alt="' + esc(r.shows) + '"></div>';
    return '<figure class="evcard" tabindex="0" data-key="' + esc(r.k) + '">'
      + img
      + '<figcaption><div class="evkey">' + esc(r.k) + '<span class="evday">Day ' + r.d + '</span></div>'
      + '<div class="evshows">' + esc(r.shows) + '</div>'
      + '<div class="evproves">Proves: ' + esc(r.proves) + '</div></figcaption></figure>';
  }
  function updateGrid() {
    var rows = evFiltered();
    var grid = $('#evGrid');
    if (!grid) return;
    grid.innerHTML = rows.map(evCard).join('')
      || '<div style="padding:34px 12px;color:var(--muted)">No captures match these filters.</div>';
    var n = rows.length, total = D.meta.counts.captures;
    $('#evCount').textContent = 'Showing ' + n + ' of ' + total + ' captures'
      + (n === total ? '' : ' (filtered)')
      + ' · ' + D.meta.counts.withheld + ' withheld from the public build (personal data)';
  }
  function renderEvidence() {
    var c = $('#content');
    var days = ['all', '0', '1', '2', '3', '4'];
    var secs = ['all'].concat(D.meta.sectionsWithEv);
    c.innerHTML = pageHead('The record', 'Evidence — every capture, what it shows, what it proves')
      + '<p class="lede">All ' + D.meta.counts.captures + ' captures from the program, one card per screenshot with its manifest metadata. Click any card for the full capture and its facts; click a <a class="evref" href="#/evidence/day4/23">day4/23</a>-style reference anywhere in the text to jump straight to it.</p>'
      + '<div class="evtoolbar">'
      + '<div class="daypills" id="dayPills">' + days.map(function (d) {
          return '<button type="button" class="pill' + (evState.day === d ? ' on' : '') + '" data-day="' + d + '">'
            + (d === 'all' ? 'All days' : 'Day ' + d) + '</button>';
        }).join('') + '</div>'
      + '<div class="evselects">'
      + '<label>Finding <select id="evSec">' + secs.map(function (s) {
          return '<option value="' + s + '"' + (evState.sec === s ? ' selected' : '') + '>'
            + (s === 'all' ? 'All findings' : '§' + s + ' ' + esc(shortOf(s))) + '</option>';
        }).join('') + '</select></label>'
      + '<label>Search <input id="evQ" type="search" placeholder="shows / proves / surface" value="' + esc(evState.q) + '"></label>'
      + '</div></div>'
      + '<div class="evcount" id="evCount"></div>'
      + '<div id="evGridWrap"><div class="evgrid" id="evGrid"></div></div>'
      + pageFoot({ hash: '#/journal', label: 'Founder journal' }, { hash: '#/data', label: 'Data tables' });
    $('#dayPills').addEventListener('click', function (e) {
      var b = e.target.closest('button.pill');
      if (!b) return;
      evState.day = b.dataset.day;
      this.querySelectorAll('.pill').forEach(function (p) { p.classList.toggle('on', p === b); });
      updateGrid();
    });
    $('#evSec').addEventListener('change', function () { evState.sec = this.value; updateGrid(); });
    $('#evQ').addEventListener('input', function () { evState.q = this.value; updateGrid(); });
    var wrap = $('#evGridWrap');
    wrap.addEventListener('click', function (e) {
      var f = e.target.closest('.evcard');
      if (f) goKey(f.dataset.key);
    });
    wrap.addEventListener('keydown', function (e) {
      if (e.key !== 'Enter' && e.key !== ' ') return;
      var f = e.target.closest('.evcard');
      if (f) { e.preventDefault(); goKey(f.dataset.key); }
    });
    updateGrid();
    document.title = 'Evidence — Gumloop Founder Teardown';
  }
  function shortOf(n) {
    var s = null;
    D.sections.forEach(function (x) { if (String(x.n) === String(n)) s = x; });
    return s ? s.short : '';
  }
  function goKey(k) { location.hash = '#/evidence/' + k; }

  /* ---------------- lightbox ---------------- */
  var lbOrder = [], curKey = null;
  function openLightbox(key) {
    var r = EVMAP[key];
    if (!r) { closeLightbox(); return; }
    lbOrder = evFiltered().map(function (x) { return x.k; });
    if (lbOrder.indexOf(key) < 0) lbOrder = [key];
    curKey = key;
    showLb(r);
    $('#lightbox').hidden = false;
    document.body.style.overflow = 'hidden';
  }
  function closeLightbox() {
    var lb = $('#lightbox');
    if (!lb) return;
    lb.hidden = true;
    document.body.style.overflow = '';
    curKey = null;
  }
  function showLb(r) {
    var wrap = $('#lbImgWrap');
    if (r.personal) {
      wrap.innerHTML = '<div class="wh-note">This capture is withheld from the public build because it contains the account owner&rsquo;s personal data. Its manifest row is preserved below.</div>';
    } else {
      wrap.innerHTML = '<img id="lbImg" alt="">';
      var im = $('#lbImg');
      im.src = r.src;
      im.alt = r.shows;
    }
    $('#lbKey').textContent = r.k;
    var facts = [
      ['Day', 'Day ' + r.d + (r.ts ? ' · ' + esc(r.ts) : '')],
      ['Surface', esc(r.surface) + (r.state ? ' — ' + esc(r.state) : '')],
      ['URL', '<code>' + esc(r.url) + '</code>'],
      ['What it shows', esc(r.shows)],
      ['Proves', esc(r.proves)],
      ['Finding', r.secs && r.secs.length
        ? '<span class="lbsecs">' + r.secs.map(function (s) { return '<a href="#/section/s' + esc(s) + '">§' + esc(s) + '</a>'; }).join('') + '</span>'
        : '—']
    ];
    $('#lbFacts').innerHTML = facts.map(function (f) { return '<dt>' + f[0] + '</dt><dd>' + f[1] + '</dd>'; }).join('');
    var i = lbOrder.indexOf(r.k);
    $('#lbPrev').disabled = i <= 0;
    $('#lbNext').disabled = i < 0 || i >= lbOrder.length - 1;
  }
  function stepLb(d) {
    return function () {
      var i = lbOrder.indexOf(curKey);
      var j = i + d;
      if (j >= 0 && j < lbOrder.length) goKey(lbOrder[j]);
    };
  }

  /* ---------------- data tables ---------------- */
  function tbl(head, rows) {
    return '<div class="tablewrap"><table><thead><tr>' + head.map(function (x) { return '<th>' + x + '</th>'; }).join('')
      + '</tr></thead><tbody>' + rows + '</tbody></table></div>';
  }
  function renderData() {
    var c = $('#content');
    var html = pageHead('The ledgers', 'Data tables')
      + '<p class="lede">Every object the program created, what each build cost, and the credit measurements behind the cliff.</p>';

    html += '<div class="datatable"><h3>Unit costs, measured per triggered run</h3>'
      + '<p class="hb-sub">From the Day 4 collision window and the watchdog&rsquo;s observed cycles.</p>'
      + tbl(['Job', 'Credits per run'], D.credits.unit.map(function (u) {
          return '<tr><td>' + esc(u[0]) + '</td><td class="num">' + esc(u[1]) + '</td></tr>';
        }).join(''))
      + '</div>';

    html += '<div class="datatable"><h3>The collision window</h3>'
      + '<p class="hb-sub">Two grid waves, 19:00 and 19:15 IST, Day 4. ' + esc(D.credits.wavesTotal) + '</p>'
      + tbl(['Wave', 'Guard', 'Edge-fail', 'Harvester', 'Watchdog', 'Total'], D.credits.waves.map(function (w) {
          return '<tr><td>' + esc(w.w) + '</td><td class="num">' + w.guard + '</td><td class="num">' + w.edge
            + '</td><td class="num">' + w.harvest + '</td><td class="num">' + (w.watchdog == null ? '—' : w.watchdog)
            + '</td><td class="num"><b>' + w.total + '</b></td></tr>';
        }).join('')
        + '<tr class="tot"><td>Both waves</td><td class="num">14</td><td class="num">38</td><td class="num">66</td><td class="num">39</td><td class="num">157</td></tr>')
      + '</div>';

    html += '<div class="datatable"><h3>The credit cliff</h3>'
      + '<p class="hb-sub">Burn at the trigger builder&rsquo;s own default cadences, against the 20,000-credit monthly allowance.</p>'
      + tbl(['Configuration', 'Credits / day', 'Allowance lasts', '$ / day at list ($0.005)', '$ / day at Pro bundle ($0.00185)'], D.credits.cliff.map(function (r) {
          return '<tr><td>' + esc(r.c) + '</td><td class="num">' + esc(r.perDay) + '</td><td class="num">' + esc(r.lasts)
            + '</td><td class="num">' + esc(r.list) + '</td><td class="num">' + esc(r.pro) + '</td></tr>';
        }).join(''))
      + '<ul class="credits-notes">' + D.credits.notes.map(function (n) { return '<li>' + esc(n) + '</li>'; }).join('') + '</ul>'
      + '</div>';

    html += '<div class="datatable"><h3>Agent build log</h3>'
      + '<p class="hb-sub">Time-to-first-agent and first-run cost for each agent built in the program.</p>'
      + tbl(['Agent', 'TTFA', 'First-run credits', 'Steps', 'Failure modes', 'Notes'], D.buildlog.map(function (r) {
          return '<tr><td class="mono">' + esc(r.agent) + '</td><td class="num">' + esc(r.ttfa_minutes) + '</td><td class="num">'
            + esc(r.credits_first_run) + '</td><td class="num">' + esc(r.steps_first_run) + '</td><td style="min-width:180px">'
            + esc(r.failure_modes) + '</td><td style="min-width:260px">' + esc(r.notes) + '</td></tr>';
        }).join(''))
      + '</div>';

    html += '<div class="datatable"><h3>Every object created for the teardown</h3>'
      + '<p class="hb-sub">The full ' + D.meta.counts.objects + '-row inventory, with teardown status. All names carry the zz-rx- program prefix.</p>'
      + tbl(['Type', 'Name', 'ID / URL', 'Status', 'Purpose', 'Notes'], D.inventory.map(function (r) {
          return '<tr><td>' + esc(r.object_type) + '</td><td><b>' + esc(r.name) + '</b><div class="mono" style="color:var(--muted)">'
            + esc(r.created_at) + '</div></td><td class="mono">' + esc(r.id_or_url) + '</td><td class="mono">' + esc(r.status)
            + '</td><td style="min-width:200px">' + esc(r.purpose) + '</td><td style="min-width:260px">' + esc(r.notes) + '</td></tr>';
        }).join(''))
      + '</div>';

    html += pageFoot({ hash: '#/evidence', label: 'Evidence' }, { hash: '#/method', label: 'Method' });
    c.innerHTML = html;
    document.title = 'Data tables — Gumloop Founder Teardown';
  }

  /* ---------------- method ---------------- */
  function renderMethod() {
    var c = $('#content');
    c.innerHTML = pageHead('About', 'Method, provenance, and how to read this')
      + '<p class="lede">How the teardown was run, what this site contains, and what remains open.</p>'
      + '<div class="methodblock"><h3>How the program was run</h3><div class="prose">' + D.blocks.intro + '</div></div>'
      + '<div class="methodblock"><h3>How this site was built</h3><div class="prose">' + D.siteNote + '</div></div>'
      + '<div class="methodblock"><h3>Where the program stands</h3><div class="prose">' + D.blocks.stands + '</div></div>'
      + '<div class="methodblock"><h3>What is still pending</h3><div class="prose">' + D.blocks.pending + '</div></div>'
      + '<div class="methodblock"><h3>Reading guide, from the report</h3><div class="prose">' + D.blocks.guide + '</div></div>'
      + pageFoot({ hash: '#/data', label: 'Data tables' }, { hash: '#/', label: 'The verdict' });
    document.title = 'Method — Gumloop Founder Teardown';
  }

  function renderNotFound() {
    $('#content').innerHTML = pageHead('404', 'No such page')
      + '<p class="lede">That route does not exist. <a href="#/">Back to the verdict.</a></p>';
    document.title = 'Not found — Gumloop Founder Teardown';
  }

  /* ---------------- search ---------------- */
  var SIDX = [];
  function stripHtml(x) {
    var d = h('div');
    d.innerHTML = x;
    return (d.textContent || '').replace(/\s+/g, ' ');
  }
  function buildIndex() {
    D.sections.forEach(function (s) {
      SIDX.push({ t: 'Finding', label: '§' + s.n + ' ' + s.short, hash: '#/section/s' + s.n,
        text: (s.title + ' ' + s.blurb + ' ' + stripHtml(s.html)).toLowerCase() });
    });
    D.journal.forEach(function (j) {
      SIDX.push({ t: 'Journal', label: j.title, hash: '#/journal/s' + j.n, text: stripHtml(j.html).toLowerCase() });
    });
    D.evidence.forEach(function (r) {
      SIDX.push({ t: 'Evidence', label: r.k + ' — ' + r.surface, hash: '#/evidence/' + r.k,
        text: (r.shows + ' ' + r.proves + ' ' + r.surface + ' ' + r.state + ' ' + r.url).toLowerCase() });
    });
  }
  function doSearch(q) {
    q = (q || '').trim().toLowerCase();
    var box = $('#sresults');
    if (q.length < 2) { box.hidden = true; box.innerHTML = ''; return; }
    var hits = [];
    SIDX.forEach(function (it) {
      var i = it.text.indexOf(q);
      if (i >= 0) {
        hits.push({ it: it, snip: it.text.slice(Math.max(0, i - 45), i + 95),
          score: (it.t === 'Finding' ? 0 : it.t === 'Journal' ? 1 : 2) * 100 + Math.min(i, 50) });
      }
    });
    hits.sort(function (a, b) { return a.score - b.score; });
    box.innerHTML = hits.slice(0, 12).map(function (o) {
      return '<a class="sr" href="' + o.it.hash + '"><span class="srtype">' + o.it.t + '</span><b>' + esc(o.it.label)
        + '</b><small>…' + esc(o.snip) + '…</small></a>';
    }).join('') || '<div class="srnone">No matches for “' + esc(q) + '”.</div>';
    box.hidden = false;
  }
  function hideResults() { var b = $('#sresults'); if (b) b.hidden = true; }

  var searchTimer = null;
  function attachBox(input) {
    var box = $('#sresults');
    if (input.id === 'qTop') {
      box.style.position = 'fixed'; box.style.top = '60px'; box.style.left = '12px';
      box.style.right = '12px'; box.style.maxHeight = '62vh';
    } else {
      box.style.position = ''; box.style.top = ''; box.style.left = '';
      box.style.right = ''; box.style.maxHeight = '';
    }
  }
  function wireSearch(input) {
    input.addEventListener('focus', function () { attachBox(input); });
    input.addEventListener('input', function () {
      attachBox(input);
      clearTimeout(searchTimer);
      var v = input.value;
      searchTimer = setTimeout(function () { doSearch(v); }, 130);
    });
    input.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') {
        var first = $('#sresults a.sr');
        if (first && !$('#sresults').hidden) {
          hideResults();
          input.blur();
          location.hash = first.getAttribute('href');
        }
      } else if (e.key === 'Escape') {
        hideResults();
        input.blur();
      }
    });
  }

  /* ---------------- mobile nav ---------------- */
  function closeNav() {
    document.body.classList.remove('nav-open');
    var b = $('#menuBtn');
    if (b) b.setAttribute('aria-expanded', 'false');
  }

  /* ---------------- router ---------------- */
  function route() {
    closeNav();
    hideResults();
    closeLightbox();
    var raw = location.hash || '#/';
    var parts = raw.replace(/^#\/?/, '').split('/').filter(Boolean);
    var p0 = parts[0] || 'home';
    var keepScroll = false;

    if (p0 === 'home') {
      renderHome(); setActive(['home']);
    } else if (p0 === 'section' && parts[1]) {
      var n = parseInt(parts[1].replace(/^s/, ''), 10);
      if (n >= 1 && n <= 12) { renderSection(n); setActive(['s' + n]); }
      else renderNotFound();
    } else if (p0 === 'journal') {
      var a = parts[1] ? parseInt(parts[1].replace(/^s/, ''), 10) : null;
      keepScroll = renderJournal(a);
      setActive(['journal']);
    } else if (p0 === 'evidence') {
      renderEvidence();
      setActive(['evidence']);
      var key = parts.length > 1 ? parts.slice(1).join('/') : null;
      if (key && EVMAP[key]) openLightbox(key);
    } else if (p0 === 'data') {
      renderData(); setActive(['data']);
    } else if (p0 === 'method') {
      renderMethod(); setActive(['method']);
    } else {
      renderNotFound();
    }
    if (!keepScroll) {
      requestAnimationFrame(function () { window.scrollTo(0, 0); });
    }
  }

  /* ---------------- global events ---------------- */
  document.addEventListener('click', function (e) {
    if (!e.target.closest('.side-search, .top-search, .sresults')) hideResults();
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && !$('#lightbox').hidden) { location.hash = '#/evidence'; }
    else if (e.key === '/' && !/INPUT|TEXTAREA|SELECT/.test((document.activeElement || {}).tagName || '')) {
      e.preventDefault();
      var q = $('#q');
      if (q) q.focus();
    }
  });
  $('#menuBtn').addEventListener('click', function () {
    var open = document.body.classList.toggle('nav-open');
    this.setAttribute('aria-expanded', String(open));
  });
  $('#scrim').addEventListener('click', closeNav);
  $('#lbBackdrop').addEventListener('click', function () { location.hash = '#/evidence'; });
  $('#lbClose').addEventListener('click', function () { location.hash = '#/evidence'; });
  $('#lbPrev').addEventListener('click', stepLb(-1));
  $('#lbNext').addEventListener('click', stepLb(1));
  window.addEventListener('hashchange', route);

  /* ---------------- init ---------------- */
  buildNav();
  wireSearch($('#q'));
  wireSearch($('#qTop'));
  buildIndex();
  route();
})();

</script>
</body>
</html>
