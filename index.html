<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gumloop Founder Teardown</title>
<meta name="description" content="Five days inside Gumloop's agent app with a real free-tier account: what works, what bills, and what hides. Every claim links to its evidence.">
<meta property="og:title" content="Gumloop Founder Teardown">
<meta property="og:description" content="Five days inside Gumloop's agent app with a real free-tier account: what works, what bills, and what hides. Every claim links to its evidence.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%234338ca'/%3E%3Ctext x='32' y='45' font-family='Georgia,serif' font-size='36' fill='%23ffffff' text-anchor='middle'%3EG%3C/text%3E%3C/svg%3E">
<style>
/* Gumloop Founder Teardown - site stylesheet (inlined at build time) */
:root{
  --bg:#f6f5f1; --panel:#ffffff; --panel2:#efede7; --ink:#1e1c19; --muted:#6e6a61;
  --line:#e3e0d8; --line2:#d2cec3;
  --accent:#4338ca; --accent-ink:#312e81; --accent-soft:#eceafd;
  --pass:#1a7f37; --pass-bg:#e6f4ea; --fail:#cf222e; --fail-bg:#ffebe9;
  --partial:#9a6700; --partial-bg:#fff8c5; --open:#0969da; --open-bg:#ddf4ff;
  --serif:"Iowan Old Style","Palatino Linotype","Book Antiqua",Palatino,Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --shadow:0 1px 2px rgba(30,28,25,.05),0 10px 30px rgba(30,28,25,.08);
  --radius:10px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 var(--sans);-webkit-font-smoothing:antialiased}
::selection{background:var(--accent-soft)}
a{color:var(--accent-ink);text-decoration:none}
a:hover{text-decoration:underline}
img{max-width:100%;display:block}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.skip{position:absolute;left:-9999px;top:0;background:var(--accent);color:#fff;padding:8px 14px;border-radius:0 0 8px 0;z-index:99}
.skip:focus{left:0}
.jserr{position:fixed;left:0;right:0;bottom:0;background:#cf222e;color:#fff;padding:8px 12px;font:12px/1.4 var(--mono);z-index:999;white-space:pre-wrap}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:14px;height:56px;padding:0 18px;
  background:rgba(246,245,241,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.menu-btn{display:none;align-items:center;justify-content:center;width:38px;height:38px;border-radius:8px;color:var(--ink)}
.menu-btn:hover{background:var(--panel2)}
.brand{display:flex;align-items:center;gap:10px;color:var(--ink);min-width:0}
.brand:hover{text-decoration:none}
.brand-mark{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:8px;
  background:var(--accent);color:#fff;font:700 16px/1 var(--serif);flex:none}
.brand-text{font:600 15px/1.2 var(--sans);white-space:nowrap}
.brand-text em{font:400 13px/1.2 var(--serif);font-style:italic;color:var(--muted);margin-left:6px}
.top-search{margin-left:auto;flex:1;max-width:340px;display:none}
.top-search input{width:100%}

/* ---------- layout ---------- */
.layout{display:grid;grid-template-columns:292px minmax(0,1fr);min-height:calc(100vh - 56px)}
.sidebar{border-right:1px solid var(--line);background:var(--panel2);padding:18px 16px 24px;position:sticky;top:56px;
  height:calc(100vh - 56px);overflow-y:auto;overscroll-behavior:contain}
.content{padding:38px 48px 90px;max-width:960px;width:100%;margin:0 auto;outline:none}

/* ---------- sidebar nav ---------- */
.side-search{position:relative;margin-bottom:16px}
.side-search input, .top-search input, .evselects input{
  width:100%;padding:9px 12px;border:1px solid var(--line2);border-radius:8px;background:var(--panel);
  font:14px var(--sans);color:var(--ink)}
.side-search input:focus, .top-search input:focus, .evselects input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.sresults{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--panel);border:1px solid var(--line2);
  border-radius:10px;box-shadow:var(--shadow);z-index:50;max-height:62vh;overflow:auto;padding:4px}
.sr{display:block;padding:9px 12px;border-radius:7px;color:var(--ink)}
.sr:hover{background:var(--accent-soft);text-decoration:none}
.sr b{display:block;font-size:13.5px;line-height:1.35}
.sr small{display:block;color:var(--muted);font-size:12px;margin-top:2px;overflow:hidden;display:-webkit-box;
  -webkit-line-clamp:2;-webkit-box-orient:vertical}
.srtype{display:inline-block;font:700 10px/1 var(--sans);letter-spacing:.07em;text-transform:uppercase;
  color:var(--accent-ink);background:var(--accent-soft);border-radius:999px;padding:3px 7px;margin-bottom:4px}
.srnone{padding:10px 12px;color:var(--muted);font-size:13px}
.nav{display:flex;flex-direction:column;gap:2px}
.navlabel{font:700 10.5px/1 var(--sans);letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:16px 4px 6px}
.navgroup:first-child .navlabel{margin-top:2px}
.navlink{display:flex;align-items:baseline;gap:6px;padding:6px 10px;border-radius:7px;color:var(--ink);font-size:14px;line-height:1.35}
.navlink:hover{background:var(--panel);text-decoration:none}
.navlink.active{background:var(--panel);box-shadow:inset 3px 0 0 var(--accent);font-weight:600}
.navmeta{margin-left:auto;font:11px var(--mono);color:var(--muted);white-space:nowrap}
.sidefoot{margin-top:26px;padding:14px 10px 0;border-top:1px solid var(--line);color:var(--muted);font-size:12px;line-height:1.7}
.sidefoot-date{font-family:var(--mono);font-size:11px}

/* ---------- page chrome ---------- */
.kicker{font:700 11px/1 var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--accent-ink);margin-bottom:10px}
h2.pt{font:700 30px/1.22 var(--serif);letter-spacing:-.01em;margin:0 0 10px}
.lede{font-size:16.5px;color:var(--muted);max-width:640px;margin:0 0 8px}
.pagefoot{margin-top:60px;padding-top:18px;border-top:1px solid var(--line);display:flex;justify-content:space-between;
  gap:14px;flex-wrap:wrap;font-size:13.5px}
.pf-links{display:flex;gap:22px}
.pf-note{color:var(--muted);font-size:12.5px}

/* ---------- prose (rendered markdown) ---------- */
.prose{margin-top:18px}
.prose h3{font:700 21px/1.3 var(--serif);margin:36px 0 10px}
.prose h4{font:700 16px/1.4 var(--sans);margin:28px 0 8px}
.prose h5,.prose h6{font:700 14.5px/1.4 var(--sans);margin:22px 0 6px;color:var(--muted)}
.prose p{margin:14px 0;max-width:72ch}
.prose ul,.prose ol{margin:14px 0;padding-left:26px;max-width:72ch}
.prose li{margin:7px 0}
.prose blockquote{margin:18px 0;padding:12px 18px;border-left:3px solid var(--accent);background:var(--panel);
  border-radius:0 8px 8px 0;font:italic 16px/1.6 var(--serif);color:#3d3a34}
.prose code{font:13.5px var(--mono);background:#f0eee8;padding:1.5px 5px;border-radius:4px;word-break:break-word}
.prose hr{border:none;border-top:1px solid var(--line);margin:26px 0}
.prose strong{font-weight:700}
.prose table{width:100%;border-collapse:collapse;font-size:14px;margin:20px 0;display:block;overflow-x:auto}
.prose th{text-align:left;font:700 11px/1.3 var(--sans);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);
  padding:8px 10px;border-bottom:2px solid var(--line2);vertical-align:bottom}
.prose td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top;line-height:1.55;min-width:8ch}
.prose tbody tr:last-child td{border-bottom:none}
.evref{font:13px var(--mono);color:var(--accent-ink);border-bottom:1px dotted var(--accent)}
.evref:hover{background:var(--accent-soft);text-decoration:none}

/* verdict chips (also used in scoreboard) */
.chip{display:inline-block;font:700 10.5px/1 var(--sans);letter-spacing:.06em;text-transform:uppercase;
  padding:4px 9px;border-radius:999px;vertical-align:1px}
.chip.pass{color:var(--pass);background:var(--pass-bg)}
.chip.fail{color:var(--fail);background:var(--fail-bg)}
.chip.partial{color:var(--partial);background:var(--partial-bg)}
.chip.open{color:var(--open);background:var(--open-bg)}

/* ---------- home ---------- */
.hero{padding:6px 0 8px}
.hero h1{font:700 38px/1.15 var(--serif);letter-spacing:-.015em;margin:0 0 14px;max-width:19ch}
.hero .sub{font:17px/1.6 var(--sans);color:#4a463e;max-width:62ch;margin:0}
.metaline{display:flex;flex-wrap:wrap;gap:8px 10px;margin-top:18px;font:12px var(--mono);color:var(--muted)}
.metaline span:nth-child(odd){color:#57534a}
.tldr{margin:30px 0 0;background:#fdfbf4;border:1px solid var(--line2);border-left:4px solid var(--accent);
  border-radius:8px;padding:18px 24px}
.tldr-label{font:700 10.5px/1 var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--accent-ink);margin-bottom:8px}
.tldr p{font:17.5px/1.62 var(--serif);margin:0;max-width:none}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:26px 0 0}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px}
.stat .v{font:700 24px/1.1 var(--serif);color:var(--accent-ink);letter-spacing:-.01em}
.stat .l{font-size:12px;line-height:1.45;color:var(--muted);margin-top:7px}
.homeblock{margin-top:44px}
.homeblock > h3{font:700 22px/1.3 var(--serif);margin:0 0 4px}
.homeblock .hb-sub{color:var(--muted);font-size:14px;margin:0 0 14px}
.secmap{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.seccard{display:flex;gap:14px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  padding:16px;color:var(--ink);transition:transform .12s ease,box-shadow .12s ease,border-color .12s ease}
.seccard:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:var(--line2);text-decoration:none}
.secnum{font:700 24px/1 var(--serif);color:var(--accent);flex:none;width:34px}
.seccard b{display:block;font:600 15px/1.35 var(--sans);margin-bottom:4px}
.seccard .secblurb{font-size:13px;line-height:1.5;color:var(--muted)}
.quicklinks{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.qlink{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;color:var(--ink)}
.qlink:hover{border-color:var(--accent);text-decoration:none}
.qlink b{font:600 14.5px var(--sans)}
.qlink small{display:block;color:var(--muted);margin-top:4px;font-size:12.5px;line-height:1.45}

/* ---------- section page ---------- */
.evchips{margin-top:34px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px}
.evchips-label{display:block;font:700 10.5px/1 var(--sans);letter-spacing:.09em;text-transform:uppercase;
  color:var(--muted);margin-bottom:10px}
.evchip{display:inline-block;font:12.5px var(--mono);border:1px solid var(--line2);padding:4px 9px;border-radius:6px;
  margin:0 6px 6px 0;color:var(--accent-ink)}
.evchip:hover{border-color:var(--accent);background:var(--accent-soft);text-decoration:none}
.evchip.wh{opacity:.55;border-style:dashed}

/* ---------- evidence browser ---------- */
.evtoolbar{display:flex;flex-wrap:wrap;gap:12px 18px;align-items:center;margin:22px 0 6px}
.daypills{display:flex;flex-wrap:wrap;gap:6px}
.pill{font:12.5px var(--mono);padding:5px 11px;border-radius:999px;border:1px solid var(--line2);background:var(--panel);
  color:#57534a}
.pill:hover{border-color:var(--accent)}
.pill.on{background:var(--accent);border-color:var(--accent);color:#fff}
.evselects{display:flex;flex-wrap:wrap;gap:10px;margin-left:auto}
.evselects label{display:flex;align-items:center;gap:7px;font:700 10.5px/1 var(--sans);letter-spacing:.08em;
  text-transform:uppercase;color:var(--muted)}
.evselects select{padding:7px 9px;border:1px solid var(--line2);border-radius:8px;background:var(--panel);
  font:13.5px var(--sans);color:var(--ink)}
.evselects input{width:190px;font-size:13.5px}
.evcount{font:12.5px var(--mono);color:var(--muted);margin:8px 0 14px}
.evgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:14px}
.evcard{margin:0;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;
  cursor:pointer;transition:box-shadow .12s ease,border-color .12s ease}
.evcard:hover,.evcard:focus-visible{border-color:var(--line2);box-shadow:var(--shadow)}
.evimg{aspect-ratio:14/9;background:var(--panel2);overflow:hidden}
.evimg img{width:100%;height:100%;object-fit:cover}
.evimg.wh{display:flex;align-items:center;justify-content:center;padding:14px;text-align:center;
  color:var(--muted);font-size:12px;line-height:1.5;border-bottom:1px dashed var(--line2)}
.evcard figcaption{padding:10px 12px 12px}
.evkey{font:700 12.5px var(--mono);color:var(--accent-ink)}
.evday{float:right;font:400 11px var(--mono);color:var(--muted)}
.evshows{font-size:13px;line-height:1.45;margin-top:6px;overflow:hidden;display:-webkit-box;
  -webkit-line-clamp:3;-webkit-box-orient:vertical}
.evproves{font-size:11.5px;line-height:1.45;color:var(--muted);margin-top:6px;overflow:hidden;display:-webkit-box;
  -webkit-line-clamp:2;-webkit-box-orient:vertical}

/* ---------- lightbox ---------- */
.lightbox{position:fixed;inset:0;z-index:60}
.lb-backdrop{position:absolute;inset:0;background:rgba(23,21,18,.88)}
.lb-panel{position:relative;margin:3vh auto 0;max-width:min(1100px,94vw);max-height:94vh;display:flex;
  flex-direction:column;background:var(--panel);border-radius:12px;overflow:hidden;box-shadow:0 24px 80px rgba(0,0,0,.4)}
.lb-imgwrap{background:#111;overflow:auto;display:flex;justify-content:center}
.lb-imgwrap img{max-height:70vh;width:auto;max-width:100%;object-fit:contain}
.lb-imgwrap .wh-note{color:#9a958b;padding:60px 30px;font-size:14px;text-align:center}
.lb-meta{padding:14px 18px 16px;border-top:1px solid var(--line)}
.lb-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.lb-key{font:700 14px var(--mono);color:var(--accent-ink)}
.lb-actions{margin-left:auto;display:flex;gap:8px}
.lb-btn{font:12.5px var(--sans);padding:5px 12px;border:1px solid var(--line2);border-radius:7px;color:var(--ink)}
.lb-btn:hover{border-color:var(--accent);background:var(--accent-soft)}
.lb-btn[disabled]{opacity:.4;cursor:default}
.lb-close{font-weight:600}
.lb-facts{display:grid;grid-template-columns:120px minmax(0,1fr);gap:5px 16px;margin:0;font-size:13.5px}
.lb-facts dt{font:700 10.5px/1.7 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.lb-facts dd{margin:0;line-height:1.5}
.lb-facts .lbsecs a{display:inline-block;font:12px var(--mono);border:1px solid var(--line2);border-radius:6px;
  padding:2px 8px;margin:0 6px 4px 0;color:var(--accent-ink)}

/* ---------- journal ---------- */
.jindex{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 8px}
.jlink{font:12.5px var(--mono);border:1px solid var(--line2);background:var(--panel);border-radius:999px;
  padding:5px 12px;color:var(--ink)}
.jlink:hover{border-color:var(--accent);text-decoration:none}
.jsession{margin-top:36px;scroll-margin-top:76px}
.jsession > h3{font:700 20px/1.35 var(--serif);margin:0 0 4px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.jt{white-space:nowrap;font:13px var(--mono)}
.tag{display:inline-block;font:700 10px/1 var(--sans);letter-spacing:.06em;text-transform:uppercase;
  border-radius:999px;padding:3px 7px;margin-left:7px;color:var(--muted);background:#f0eee8;vertical-align:1px}
.t-DELIGHT{color:#1a7f37;background:#e6f4ea}
.t-CONFUSED{color:#9a6700;background:#fff8c5}
.t-EXPECT{color:#0969da;background:#ddf4ff}
.t-AHA{color:#8250df;background:#f3eaff}
.t-STEAL{color:#cf222e;background:#ffebe9}

/* ---------- data view ---------- */
.datatable{margin-top:30px}
.datatable > h3{font:700 20px/1.3 var(--serif);margin:0 0 4px}
.datatable .hb-sub{color:var(--muted);font-size:13.5px;margin:0 0 12px}
.tablewrap{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius)}
.tablewrap table{width:100%;border-collapse:collapse;font-size:13.5px;margin:0}
.tablewrap th{text-align:left;font:700 10.5px/1.3 var(--sans);letter-spacing:.07em;text-transform:uppercase;
  color:var(--muted);padding:10px 12px;border-bottom:2px solid var(--line2);white-space:nowrap}
.tablewrap td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top;line-height:1.5}
.tablewrap tbody tr:last-child td{border-bottom:none}
.mono{font-family:var(--mono);font-size:12px}
.credits-notes{margin:14px 0 0;padding-left:22px;color:#4a463e;font-size:14px;max-width:74ch}
.credits-notes li{margin:6px 0}
.num{text-align:right;font-family:var(--mono);font-size:12.5px;white-space:nowrap}
.tot td{font-weight:700;border-top:2px solid var(--line2);background:var(--panel2)}

/* ---------- method ---------- */
.methodblock{margin-top:34px}
.methodblock > h3{font:700 20px/1.3 var(--serif);margin:0 0 4px}

/* ---------- scrim + responsive ---------- */
.scrim{display:none}
@media (max-width:960px){
  .layout{display:block;min-height:none}
  .sidebar{position:fixed;left:0;top:56px;bottom:0;width:302px;height:auto;z-index:45;
    transform:translateX(-103%);transition:transform .22s ease;box-shadow:var(--shadow)}
  body.nav-open .sidebar{transform:none}
  body.nav-open .scrim{display:block;position:fixed;inset:0;top:56px;background:rgba(23,21,18,.3);z-index:44}
  .menu-btn{display:inline-flex}
  .top-search{display:block}
  .content{padding:26px 20px 70px;max-width:none}
  .hero h1{font-size:30px}
  .prose p,.prose ul,.prose ol{max-width:none}
  .evselects{margin-left:0}
  .lb-facts{grid-template-columns:96px minmax(0,1fr)}
}
@media (max-width:560px){
  .stats{grid-template-columns:repeat(2,1fr)}
  .secmap{grid-template-columns:1fr}
  .brand-text em{display:none}
}

</style>
</head>
<body>
<a class="skip" href="#content">Skip to content</a>
<header class="topbar">
  <button class="menu-btn" id="menuBtn" aria-label="Open navigation" aria-expanded="false" aria-controls="sidebar">
    <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>
  </button>
  <a class="brand" href="#/"><span class="brand-mark" aria-hidden="true">G</span><span class="brand-text">Gumloop <em>Founder Teardown</em></span></a>
  <div class="top-search">
    <input id="qTop" type="search" placeholder="Search the analysis" autocomplete="off" aria-label="Search the analysis">
  </div>
</header>
<div class="layout">
  <aside class="sidebar" id="sidebar" aria-label="Site navigation">
    <div class="side-search">
      <input id="q" type="search" placeholder="Search sections, evidence, journal" autocomplete="off" aria-label="Search sections, evidence and journal">
      <div class="sresults" id="sresults" hidden></div>
    </div>
    <nav id="nav" class="nav"></nav>
    <div class="sidefoot">
      <div>162 evidence captures</div>
      <div>n=1 &middot; zero real-world actions</div>
      <div class="sidefoot-date">Program closed 2026-09-13</div>
    </div>
  </aside>
  <main id="content" class="content" tabindex="-1"></main>
</div>
<div class="scrim" id="scrim"></div>
<div class="lightbox" id="lightbox" hidden role="dialog" aria-modal="true" aria-label="Evidence viewer">
  <div class="lb-backdrop" id="lbBackdrop"></div>
  <div class="lb-panel">
    <div class="lb-imgwrap" id="lbImgWrap"><img id="lbImg" alt=""></div>
    <div class="lb-meta">
      <div class="lb-head">
        <span class="lb-key" id="lbKey"></span>
        <span class="lb-actions">
          <button class="lb-btn" id="lbPrev" type="button">Prev</button>
          <button class="lb-btn" id="lbNext" type="button">Next</button>
          <button class="lb-btn lb-close" id="lbClose" type="button">Close</button>
        </span>
      </div>
      <dl class="lb-facts" id="lbFacts"></dl>
    </div>
  </div>

<script>
window.__DATA__ = {"meta":{"title":"Gumloop Founder Teardown","updated":"2026-09-13","counts":{"captures":162,"shown":150,"withheld":12,"sections":12,"sessions":5,"objects":18},"sectionsWithEv":["3","4","5","6","8","9","10","11"]},"tldr":"Gumloop's agent app is the fastest zero-to-working-agent surface tested: a non-builder shipped a scheduled watchdog in 17.5 minutes. It remembers across conversations, runs unattended, and refuses to hallucinate on ambiguous jobs. The moat is the connector wall; the cliff is the meter — a four-agent grid burns the 20,000-credit monthly allowance in under two days, a single watchdog in five to eleven. Multiplayer is permission-sharing on personal objects, not shared infrastructure, and the ledger calls blocked runs Completed.","stats":[{"v":"17.5 min","l":"from Create Agent to a working scheduled watchdog (45 credits, 16 steps)"},{"v":"7 credits","l":"floor cost of one triggered run — a heartbeat that replies one word"},{"v":"11,300 / day","l":"credits burned by a four-agent grid on default schedules"},{"v":"under 2 days","l":"for that grid to exhaust the 20,000-credit monthly allowance"},{"v":"$56.50 / day","l":"the grid at list price — $20.90 at the Pro bundle rate"},{"v":"162","l":"evidence captures; every claim in this report links to one"}],"blocks":{"intro":"\u003cp>\u003cstrong>What this is:\u003c/strong> the living, readable teardown of Gumloop from a founder's chair. Every claim below is backed by a screenshot in \u003ccode>screenshots/app/\u003c/code> and a row in \u003ccode>research/gumloop/screenshot-manifest.csv\u003c/code>. This file is appended to after every task set; the final 13-section assembly (per FOUNDER-TEARDOWN-PLAN §7) happens at wrap-up. Raw evidence lives in \u003ccode>research/gumloop/founder-journal.md\u003c/code> (timestamped entries), not here — here is the synthesis.\u003c/p>\n\u003cp>\u003cstrong>Method:\u003c/strong> one real free-tier account (\u003ccode>[email redacted]\u003c/code>, \"Default Team\"), driven as a non-ICP operator would drive it, Days 0-4 compressed into one session with elapsed-time instruments labeled honestly. n=1 throughout. Zero real-world actions (no email, no Slack, no payments, no RSVPs).\u003c/p>\n\u003cp>\u003cstrong>Account state at start of this report:\u003c/strong> 20.0k credits, 4 pre-existing agents (onboarding + F0 capture artifact), one scheduled Daily Chew trigger, zero skills beyond Tone/Design, empty Brain.\u003c/p>","stands":"\u003ctable>\u003cthead>\u003ctr>\u003cth>Phase\u003c/th>\u003cth>Status\u003c/th>\u003cth>Evidence\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Day 0 — virgin state + first contact\u003c/td>\u003ctd>\u003cstrong>done, pushed\u003c/strong>\u003c/td>\u003ctd>32 day0 screenshots; TTFV 2:00 from send / 4:09 from open; 75-credit first session (52+23)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Day 1 — the real job\u003c/td>\u003ctd>\u003cstrong>done, pushed\u003c/strong>\u003c/td>\u003ctd>watchdog agent built TTFA 17.5 min; 45-credit first run; 30-min trigger; Brain source; correction pattern; half-finished agent seeded\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Day 2 — the cold open\u003c/td>\u003ctd>\u003cstrong>done, pushed (d82c13d)\u003c/strong>\u003c/td>\u003ctd>autonomous trigger cycle observed (85 credits); Brain synced; no skill emergence (window too short); abandonment silent\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Day 3 — multiplayer + admin + edges\u003c/td>\u003ctd>\u003cstrong>done, pushed (d82c13d)\u003c/strong>\u003c/td>\u003ctd>surfaces + promotion + edge jobs (33 screenshots, manifest 103 rows at the time)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Day 4 — Wave 3 stress + switch test\u003c/td>\u003ctd>\u003cstrong>done, pushed (d82c13d)\u003c/strong>\u003c/td>\u003ctd>collision window: 2 waves, 7 scheduled runs, all Completed, 157 credits/20 min; floor cost 7 credits/run; cliff formalized (§10); persistence without objects (§11); switch test (§12)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Wrap-up — records, commit/push\u003c/td>\u003ctd>\u003cstrong>done\u003c/strong>\u003c/td>\u003ctd>org share reverted (\u003ca class=\"evref\" href=\"#/evidence/day4/29\">day4/29\u003c/a>); three 15-min triggers removed via the drawer's unlabeled ellipsis menu (\u003ca class=\"evref\" href=\"#/evidence/day4/50\">day4/50\u003c/a>-52c); final state: Upcoming Triggers · Agents · 1 (watchdog only), credits 18.8k of 20.0k\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>","scoreboard":"\u003ctable>\u003cthead>\u003ctr>\u003cth>Falsifier\u003c/th>\u003cth>Verdict\u003c/th>\u003cth>Evidence\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Anyone can build (TTFA &gt; 45 min?)\u003c/td>\u003ctd>\u003cspan class=\"chip pass\">PASS\u003c/span> 17.5 min\u003c/td>\u003ctd>\u003ca class=\"evref\" href=\"#/evidence/day1/20\">day1/20-22\u003c/a>, build-log\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Skills compound (no learned skill after ~10 corrections?)\u003c/td>\u003ctd>\u003cspan class=\"chip open\">OPEN\u003c/span> compression-limited: no skill object emerged (~2 corrections applied), but behavior-level persistence observed twice (Gumball brevity across conversations; edge-fail resolving \"the usual site\" from a prior chat under autonomous triggering)\u003c/td>\u003ctd>\u003ca class=\"evref\" href=\"#/evidence/day4/10\">day4/10\u003c/a>, \u003ca class=\"evref\" href=\"#/evidence/day4/15\">day4/15-16\u003c/a>, \u003ca class=\"evref\" href=\"#/evidence/day4/28c\">day4/28c\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Agent layer is cheap (credit cliff before 8 agents?)\u003c/td>\u003ctd>\u003cspan class=\"chip fail\">FAIL\u003c/span> formalized: floor 7 credits/run; one watchdog on its default cadence burns the 20k allowance in 5-11 days; the 4-agent grid in under 2 days\u003c/td>\u003ctd>\u003ca class=\"evref\" href=\"#/evidence/day4/23\">day4/23\u003c/a>, \u003ca class=\"evref\" href=\"#/evidence/day4/28b\">day4/28b\u003c/a>, §10\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Multiplayer is real (no ownership/permission model on promotion?)\u003c/td>\u003ctd>\u003cspan class=\"chip partial\">PARTIAL\u003c/span> sharing-only: a permission model exists (Restricted/Org/Anyone + invites) but no transfer; nothing crosses personal→team\u003c/td>\u003ctd>\u003ca class=\"evref\" href=\"#/evidence/day3/11\">day3/11-20\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Debugging is solved (failed runs give no actionable cause?)\u003c/td>\u003ctd>\u003cspan class=\"chip partial\">PARTIAL\u003c/span> inverted — the agent's own failure reporting is specific and honest, but blocked runs land as Completed, the Failed/Approval tabs never fire, and triggered-run output hides in per-run chat threads\u003c/td>\u003ctd>\u003ca class=\"evref\" href=\"#/evidence/day3/29\">day3/29-33\u003c/a>, \u003ca class=\"evref\" href=\"#/evidence/day4/24\">day4/24-25\u003c/a>, \u003ca class=\"evref\" href=\"#/evidence/day4/28c\">day4/28c\u003c/a>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>","pending":"\u003col>\u003cli>\u003cstrong>Done at wrap-up:\u003c/strong> the org share is reverted to Restricted and the three 15-minute collision triggers are removed (their delete affordance — an unlabeled ellipsis in the trigger drawer — is itself a finding, §7). \u003cstrong>Still live by design: the watchdog's 30-minute trigger\u003c/strong> (\u003ccode>zz-rx-pricing-watch\u003c/code>) — its removal is the §8 teardown step and is one command away on request. At the observed cadence it burns ~80 credits/hour (~1,900/day; the remaining 18.8k allowance drains in ~10 days unattended).\u003c/li>\u003cli>\u003cstrong>Post-program, on request:\u003c/strong> the full 13-section assembly of this report (per plan §7) — the content is all here; the restructure is mechanical.\u003c/li>\u003cli>\u003cstrong>Stated as compression limits (not product verdicts):\u003c/strong> learned-skill emergence (~10 corrections needed, ~2 applied), the Daily Chew trigger's next run (tomorrow 8am, outside the window), and the model picker behind the \"Advanced\" toggle (never clicked).\u003c/li>\u003c/ol>","guide":"\u003cul>\u003cli>\u003cstrong>This file\u003c/strong> — the running synthesis (updated after every task set).\u003c/li>\u003cli>\u003ccode>research/gumloop/founder-journal.md\u003c/code> — the raw timestamped journal, every observation with screenshot refs.\u003c/li>\u003cli>\u003ccode>research/gumloop/screenshot-manifest.csv\u003c/code> — every screenshot with what it shows and what claim it proves (162 rows — every screenshot in the program).\u003c/li>\u003cli>\u003ccode>research/gumloop/app-inventory.csv\u003c/code> — every \u003ccode>zz-rx-\u003c/code> object created for the teardown, with teardown status.\u003c/li>\u003cli>\u003ccode>research/gumloop/build-log.csv\u003c/code> — build-cost log for the watchdog agent.\u003c/li>\u003cli>\u003ccode>output/00-05\u003c/code> — the prior research pass (deep dive, competitive landscape, build insights, implications, falsification pass).\u003c/li>\u003c/ul>"},"siteNote":"\u003cp>This site is a static build from the private research workspace that produced the teardown: the report (\u003ccode>output/07-FOUNDER-TEARDOWN.md\u003c/code>), the raw journal (\u003ccode>research/gumloop/founder-journal.md\u003c/code>), the 162-row screenshot manifest, and the object and cost ledgers. It loads no external assets and tracks nothing.\u003c/p>\n\u003cp>Of the 162 evidence captures, \u003cstrong>150 are published here\u003c/strong>; 12 are withheld because they contain the account owner's personal data, and the account email and bank-message content are redacted from all text. Withheld captures keep their manifest rows so the evidence record stays complete.\u003c/p>\n\u003cp>The views map to sources: \u003cstrong>Findings\u003c/strong> and the scoreboard come from the report; \u003cstrong>Founder journal\u003c/strong> is the raw timestamped journal; \u003cstrong>Evidence\u003c/strong> is the screenshot manifest; \u003cstrong>Data tables\u003c/strong> are the object inventory, the build log, and the credit ledger.\u003c/p>","sections":[{"n":1,"title":"1. Anyone can build (Day 1) — PASS, and it is not close","short":"Anyone can build","blurb":"A non-builder shipped a working scheduled watchdog in 17.5 minutes and 45 credits. The falsifier asked for over 45; it was not close.","html":"\u003cp>The plan's falsifier was \"TTFA &gt; 45 min disconfirms anyone-can-build.\" Building the competitor-watchdog agent — instructions, trigger, first working run — took \u003cstrong>17.5 minutes\u003c/strong>, and ~4 of those were my own tooling fumbles (a case-sensitive button match, a placeholder-vs-rendered-text mixup). The build loop is: click Create Agent, describe the job in plain English, click through the suggested trigger. The trigger builder is natural-language cron — \"Every 30 minutes\" typed as text or picked from chips, parsed and echoed back (\"Every 30 minutes, every hour, every day\"). No cron syntax anywhere. It is the best trigger UX I have used. (\u003ca class=\"evref\" href=\"#/evidence/day1/13\">day1/13-scheduled-trigger-form.png\u003c/a>, \u003ca class=\"evref\" href=\"#/evidence/day1/15\">day1/15-schedule-filled.png\u003c/a>)\u003c/p>\n\u003cp>The first run of that agent: 16 steps, \u003cstrong>45 credits\u003c/strong>, both pricing pages fetched read-only, and a \u003ccode>Pricing Snapshot — JSON • V1\u003c/code> artifact saved \u003cem>unprompted\u003c/em> — the instructions asked for it, and unlike the Day-0 chat, no second prompt was needed.\u003c/p>"},{"n":2,"title":"2. The product works while you are away (Day 2) — confirmed, n=2","short":"Works while you are away","blurb":"The 30-minute trigger fired twice more with no one watching; both runs landed Completed. The retention loop pulls you back to work you did not do.","html":"\u003cp>The 30-minute trigger fired autonomously twice more during Day 3 work: \"Pricing watch and comparison — 41 credits\" and \"Pricing watch — 40 credits\", both Completed without me touching anything. The tasks ledger is the proof; the home page surfaces the accrued state on return (Recent Activity, Upcoming Triggers, Most Used Agents). The retention loop has a visible entry point — the product pulls you back to work it did without you.\u003c/p>"},{"n":3,"title":"3. The credit cliff is structural (Days 2-3) — the strongest finding so far","short":"The credit cliff is structural","blurb":"One modest watchdog on its own default cadence burns the whole 20k monthly allowance in about five days. The better the trigger UX, the faster the burn.","html":"\u003cp>One 30-minute cycle of one modest watchdog costs \u003cstrong>81-85 credits\u003c/strong> (two measurements: 85, then 81). At the trigger's own default cadence that is ~3,900-4,080 credits/day — the entire 20k monthly allowance in \u003cstrong>~5 days\u003c/strong>, for a single agent doing a single comparison job. The product's success loop is its own budget burner: the better the trigger UX (and it is excellent), the faster a non-ICP user burns out of credits. This reproduces, arithmetically, the post-pivot complaint cluster (credits evaporating on scheduled agents). The Day 4 formalization (credits × frequency vs the $37/mo Pro tier) will put a dollar figure on it.\u003c/p>\n\u003cp>The one counterpoint worth stealing: the Brain's pre-sync approval panel — \"documents found: 1, to sync: 1, \u003cstrong>estimated cost ~5 credits\u003c/strong>\" with a re-sync warning — is the only place in the product that shows a price \u003cem>before\u003c/em> the action rather than in the ledger after it. Every credit-consuming surface should work that way. (\u003ca class=\"evref\" href=\"#/evidence/day1/40\">day1/40-brain-credit-estimate.png\u003c/a>)\u003c/p>"},{"n":4,"title":"4. Cross-conversation memory is real (Day 1)","short":"Cross-conversation memory","blurb":"Given standing context once, Gumball later produced a briefing in exactly the format of a deliverable from a different conversation. The most defensible daily-use behavior.","html":"\u003cp>Given standing context once (\"I run a competitive-research program on AI agent platforms…\"), Gumball later produced a full Lindy competitive briefing — sourced live — in \u003cem>exactly the format of the n8n briefing from a different conversation the previous session\u003c/em>, ending with an offer to fold it into a running comparison doc. It remembered the shape of my deliverable across conversations and applied it to a competitor mentioned in passing. 13 steps, 9 credits. This is the product's most defensible daily-use behavior.\u003c/p>"},{"n":5,"title":"5. The multiplayer layer is real infrastructure wrapped around an empty room (Day 3)","short":"Multiplayer: an empty room","blurb":"The team namespace mirrors the personal one and every surface is empty. No promotion exists; sharing is permission-only, and nothing crosses over.","html":"\u003cp>\u003ccode>/teams/&lt;id&gt;/*\u003c/code> mirrors the personal namespace completely — home, agents, brain, skills, artifacts, connectors, tasks, secrets — and every surface is empty. Nothing crosses the personal→team boundary on its own: the Brain source, the Tone/Design skills, the agents, the activity — none of it follows you into the team. The org settings tree is Enterprise-shaped top to bottom (Members, Custom Roles, SAML &amp; SCIM, AI Providers, Models, API Keys &amp; Proxies, Connectors &amp; MCP, Policies, Audit Logging, Data Export), and \u003ccode>/settings/organization/insights\u003c/code> is an Enterprise billboard: the feature list renders, the analytics do not. The promotion test is done, and the answer is: \u003cstrong>nothing transfers, because there is no promotion.\u003c/strong> The agent Settings tab has no move-to-team control — its affordances are Make a Copy and a Danger Zone. The only sharing path is a Google-Docs-style Share dialog: invite users by email, or set General Access to Restricted / Organization (\"Users in Astronaut can view this Agent\") / Anyone. I set Organization access and verified it persisted — and the team namespace did not move: the watchdog does not appear in team agents, team home still shows no activity and no upcoming triggers (its live 30-minute trigger does not surface there), and team Brain stays empty. Sharing grants view/chat/edit, and each collaborator gets their own chat history; ownership, listing, trigger, Brain, and history all remain personal. The team namespace is a parallel silo you would rebuild in, not a destination you move to. (\u003ca class=\"evref\" href=\"#/evidence/day3/11\">day3/11\u003c/a> through \u003ca class=\"evref\" href=\"#/evidence/day3/20\">day3/20\u003c/a>)\u003c/p>"},{"n":6,"title":"6. The surfaces you cannot see until you need them (Day 3)","short":"Hidden surfaces","blurb":"Approval Required and Failed tabs that read \"No history yet\", a model picker that would not open, and the connector wall that is the real moat.","html":"\u003cul>\u003cli>\u003cstrong>HITL exists but is unexercised:\u003c/strong> an \"Approval Required\" tab sits in tasks next to \"Failed\" — and shows \"No history yet.\" You cannot see what an approval request looks like without triggering one. The designed-to-fail job will trigger one.\u003c/li>\u003cli>\u003cstrong>The model picker did not open:\u003c/strong> Agent Preferences offers a single \"Auto\" next to \"Advanced\"; clicking Auto changed nothing visible. The product picks the model and does not show which one per run — on this plan at least. [UNPROVEN: may exist behind Advanced]\u003c/li>\u003cli>\u003cstrong>The connector catalog is the moat:\u003c/strong> Discover/All/Connected/Popular plus \"Add Custom MCP\"; popular leads with Google Sheets, Slack, Notion, Gmail, GitHub, then Stripe, Salesforce, HubSpot. Everything else in the app is a chat loop on top of this wall.\u003c/li>\u003c/ul>"},{"n":7,"title":"7. The smaller observations that add up","short":"Smaller observations","blurb":"Verbosity by default, silent abandonment, a Brain you cannot type into, and a trigger delete hidden behind an unlabeled ellipsis.","html":"\u003cul>\u003cli>\u003cstrong>Verbosity is the default\u003c/strong> (~3,800-char answers to one-line questions); one correction (\"Too long. Under 50 words, no preamble.\") fixed it instantly and the short answers persisted across two later conversations — suggestive for skill learning, not yet proof (the Skills page still shows only Tone/Design after ~2 corrections; the falsifier wants ~10).\u003c/li>\u003cli>\u003cstrong>Abandonment is silent:\u003c/strong> the deliberately half-finished agent (\u003ccode>zz-rx-half-finished\u003c/code>) has drawn no nudge anywhere outside its own workspace — the \"Get started\" prompt exists only inside the workspace you already left.\u003c/li>\u003cli>\u003cstrong>The Brain has no native note type:\u003c/strong> knowledge enters by sync or upload, never by typing. For a product called Brain, you cannot think into it directly.\u003c/li>\u003cli>\u003cstrong>Two config tabs, split unintuitively:\u003c/strong> \"Settings\" holds name/description/secrets/danger-zone; \"Agent\" holds the actual brain (instructions, triggers, connectors, skills, knowledge, subagents, abilities).\u003c/li>\u003cli>\u003cstrong>The Agent tab is the operating system:\u003c/strong> Allow Self-Updates, AI-managed Triggers/Connectors/Skills, self-cloning subagents, and an abilities grid with Tool Discovery on AUTO — four AI-managed subsystems on one panel. The autonomy pitch is literal in the config surface. (\u003ca class=\"evref\" href=\"#/evidence/day3/13\">day3/13\u003c/a>)\u003c/li>\u003cli>\u003cstrong>TTFV was 2:00 from send\u003c/strong> on the first real question (Day 0b) — fast enough to feel conversational, slow enough to break flow once.\u003c/li>\u003cli>\u003cstrong>The trigger delete hides behind an unlabeled ellipsis:\u003c/strong> the trigger drawer shows only \"Edit trigger\"; the edit form offers only Back and Save changes; every labeled kebab on the page opens an agent-level menu. The actual trigger menu — Deactivate trigger / Delete trigger — sits behind an icon-only ⋮ button with no aria-label inside the drawer. Creation is one visible click; deletion took six passes to find (Day 4 wrap-up, \u003ca class=\"evref\" href=\"#/evidence/day4/50\">day4/50\u003c/a>).\u003c/li>\u003c/ul>"},{"n":8,"title":"8. The edge jobs (Day 3): better than its marketing, and its failures are better hidden","short":"The edge jobs","blurb":"A 30-row Hacker News harvest in 3.5 minutes with zero code, and an agent that refused to hallucinate. Both blocked runs still landed Completed.","html":"\u003cul>\u003cli>\u003cstrong>The unadvertised cluster just works.\u003c/strong> The prior research scored \"web scraping &amp; data extraction\" as \u003cem>working-unmarketed\u003c/em> — real capability, zero marketing placement. Confirmed in one build: \u003ccode>zz-rx-hn-harvester\u003c/code>, plain-English instructions, one chat run — 30 structured rows off the Hacker News front page (rank, title, points, comments, flags, both URLs), three relevance flags, and a versioned CSV artifact saved unprompted. 36 credits, ~3.5 minutes, zero code. The scraping engine underneath the marketed stories is general. (\u003ca class=\"evref\" href=\"#/evidence/day3/21\">day3/21-27\u003c/a>)\u003c/li>\u003cli>\u003cstrong>The fail agent refuses to hallucinate.\u003c/strong> Given deliberately ambiguous instructions (\"fetch the competitor data we discussed from the usual site\") and \"Run it now.\", the agent stopped before acting: it had searched the chat, the workspace, AGENT.md, and prior conversations, found no URL and no tracker, and said exactly that — \"I did not guess a competitor URL, did not write a new tracker.\" Pointed at LinkedIn (bot-blocked), it tried three URL variants, reported \"LinkedIn is blocking the fetch,\" refused to substitute third-party snippets, and asked whether to retry or stop. This is the honest-failure behavior the agent-platform market claims and rarely shows. (\u003ca class=\"evref\" href=\"#/evidence/day3/29\">day3/29-30\u003c/a>)\u003c/li>\u003cli>\u003cstrong>But the failure UX is chat-only.\u003c/strong> Both blocked runs landed in the tasks ledger as \u003cstrong>Completed\u003c/strong> (25 credits for the LinkedIn run). The Failed tab still reads \"No history yet.\" The Approval Required tab still reads \"No history yet\" — even though the agent asked direct questions mid-run. Agent questions do not route to the approval queue; that queue is for a different event class. A scheduled agent that blocks on a question has no visible surface outside its own chat — if you are not watching, you do not know it is waiting for you. (\u003ca class=\"evref\" href=\"#/evidence/day3/31\">day3/31-33\u003c/a>)\u003c/li>\u003c/ul>"},{"n":9,"title":"9. The collision window (Day 4) — the grid holds; the output hides","short":"The collision window","blurb":"Seven scheduled runs across two waves, all Completed, 157 credits in 20 minutes. The output hides in per-run chat threads the ledger never shows.","html":"\u003cp>Two full grid waves (19:00 and 19:15) with four schedules across three agents: \u003cstrong>seven triggered runs, every one Completed, 157 credits in 20 minutes.\u003c/strong> No collisions, no failures, no queue events — the Failed and Approval Required tabs still read \"No history yet\" after seven scheduled runs including a blocked one. The scheduler itself is solid.\u003c/p>\n\u003cp>What the window exposed is where the output goes. Each triggered run spawns \u003cstrong>its own chat thread\u003c/strong> — the guard's Recents lists \"Heartbeat check\" / \"Heartbeat Check\", the edge-fail's lists three — and the ledger records only cost and status. The heartbeat thread: \"Run the heartbeat: reply OK.\" answered \"OK — heartbeat received at 2026-09-13 13:45 UTC. All systems nominal.\" — 7 credits. The edge-fail's triggered thread is the more interesting one: the scheduled run resolved \"the usual site\" to \u003cstrong>the n8n LinkedIn page from a prior chat\u003c/strong>, stayed read-only, stated its assumptions instead of blocking this time (\"update the tracker means write into an existing tracker, not invent a new one\"), reported \"No email, Slack, payments, or external writes\" — and landed in the ledger as \u003cstrong>Completed at 19 credits\u003c/strong>. Memory works under autonomous triggering; guardrails held; and a run that cannot do its job still bills and \"completes.\" If you are not watching the threads, you do not know what your agents did — the ledger will not tell you. (\u003ca class=\"evref\" href=\"#/evidence/day4/23\">day4/23-28c\u003c/a>)\u003c/p>"},{"n":10,"title":"10. The credit cliff, formalized (Day 4) — FAIL, with numbers","short":"The cliff, formalized","blurb":"Floor 7 credits a run, grid 11,300 a day, watchdog 1,776-4,080 a day. The chat product is cheap; the scheduler is the cliff.","html":"\u003cp>Unit costs, measured per triggered run: \u003cstrong>floor 7\u003c/strong> (a heartbeat that replies one word), \u003cstrong>19\u003c/strong> (a run that only blocks), \u003cstrong>33\u003c/strong> (a 30-row scrape), \u003cstrong>37-85\u003c/strong> (the watchdog, n=4 cycles). Burn rates at the trigger builder's own default cadences:\u003c/p>\n\u003cul>\u003cli>\u003cstrong>The 4-agent collision grid:\u003c/strong> 157 credits in 20 minutes ≈ 11,300/day → the entire 20k monthly allowance in \u003cstrong>under 2 days\u003c/strong>.\u003c/li>\u003cli>\u003cstrong>One watchdog at 30 minutes:\u003c/strong> 1,776-4,080/day → the allowance in \u003cstrong>5-11 days\u003c/strong>.\u003c/li>\u003cli>\u003cstrong>The floor — a do-nothing agent on a 15-minute schedule:\u003c/strong> 672/day → the whole allowance in \u003cstrong>~30 days\u003c/strong>. \"Set and forget\" costs the entire subscription if you forget for a month.\u003c/li>\u003c/ul>\n\u003cp>In dollars: the grid burns $56.50/day at the $0.005 list price, $20.90/day at the Pro bundle rate ($37 for 20k credits = $0.00185/credit) — the $37 month consumed in under two days, before the background meters (\u003ccode>inbox_classification\u003c/code> bills 1 credit every 1-3 hours whether the product is used or not; \u003ccode>brain_indexing\u003c/code> bills per sync). The falsifier asked whether the cliff arrives before 8 agents: \u003cstrong>it arrives with one agent on its own default schedule.\u003c/strong> The counterpoint that keeps this from being a pure indictment: the whole program — Days 0-4, every build, chat, read, and ~30 scheduled runs — ended at \u003cstrong>18.8k of 20.0k: ~1,200 credits total\u003c/strong>, of which ~640 was the collision grid's 8 waves (the first 2 the intended observation window, the last 6 the cost of locating the delete affordance). The interactive product — every build, chat, and read across four days — cost only a few hundred credits. The chat product is cheap; the scheduler is the cliff. One more wrinkle: the product's two cost surfaces disagree — the trigger drawer's credit counter undercounts the ledger's per-run sums by exactly 3 on all three triggers (18 vs 21, 100 vs 103, 56 vs 59). The Brain's pre-sync cost estimate remains the only before-the-action price surface in the product. (\u003ca class=\"evref\" href=\"#/evidence/day4/23\">day4/23\u003c/a>, \u003ca class=\"evref\" href=\"#/evidence/day4/28b\">day4/28b\u003c/a>, \u003ca class=\"evref\" href=\"#/evidence/day4/11\">day4/11\u003c/a>, \u003ca class=\"evref\" href=\"#/evidence/day4/53\">day4/53\u003c/a>)\u003c/p>"},{"n":11,"title":"11. Persistence without objects (Day 4) — memory is real, skills are not (yet)","short":"Persistence without objects","blurb":"Memory changes what agents do across conversations, but the Skills page never moved off two. Dust ships skill objects; Gumloop ships behavior.","html":"\u003cp>Two independent persistence observations on Day 4. Gumball, fresh chat, plain question: a \u003cstrong>579-character structured answer with no preamble\u003c/strong> (against ~3,800 characters on Day 0b) — the Day-1 brevity correction carried across conversations in effect, though not strictly (it ran ~90 words against the instructed 50). And the edge-fail agent, triggered autonomously, resolved \"the usual site\" to the n8n LinkedIn page from a prior chat — memory inside an agent, under scheduling, with no one watching. Against that: \u003cstrong>the Skills page never moved off 2\u003c/strong> (Tone, Design) for the whole program. Persistence in this product is behavioral and invisible — it changes what agents do, but there is no object to inspect, version, or share. Dust ships skill objects; Gumloop ships behavior. n=1 on each observation, and the learned-skill falsifier (~10 corrections) was not reachable in the compressed window — stated as a compression limit, not a product verdict. (\u003ca class=\"evref\" href=\"#/evidence/day4/15\">day4/15-16\u003c/a>, \u003ca class=\"evref\" href=\"#/evidence/day4/28c\">day4/28c\u003c/a>, \u003ca class=\"evref\" href=\"#/evidence/day4/10\">day4/10\u003c/a>)\u003c/p>"},{"n":12,"title":"12. The switch test (Day 4) — who moves, who stays","short":"The switch test","blurb":"The build experience earns the switch for the conversational minority; the credit cliff and the empty multiplayer room send the scheduled-workload majority back.","html":"\u003cp>Would a real Zapier/n8n/Dust user move to Gumloop?\u003c/p>\n\u003cp>\u003cstrong>What they'd get:\u003c/strong> the build loop (17.5 minutes from intent to a running scheduled agent; nothing in the Zapier/n8n world gets a non-engineer there that fast), natural-language cron (\"Every 30 minutes\" typed as text), the connector wall plus the Brain's MCP catalog, cross-conversation memory that shapes output, agents that self-report failure honestly, and versioned artifacts saved unprompted.\u003c/p>\n\u003cp>\u003cstrong>What they'd give up:\u003c/strong> determinism (a Gumloop run is a chat thread — \"16 Steps\" you can read but not open; a Zapier/n8n run is an inspectable graph you can debug); cost predictability (Zapier bills countable tasks, self-hosted n8n is free, Gumloop burns 7-85 credits per run plus an 8% orchestration toll — §10's cliff); shared ownership (Dust's multiplayer is real — shared agents, SCIM groups; Gumloop's team namespace is an empty room and sharing is permission-only); and inspectable skills (Dust ships skill objects; Gumloop's persistence is behavioral).\u003c/p>\n\u003cp>\u003cstrong>Who should move:\u003c/strong> the non-technical operator with a conversational, ambiguous, scheduled job — research digests, monitoring, summarization — who will never open a node graph and whose volume is a few runs a day. \u003cstrong>Who should not:\u003c/strong> high-volume scheduled workloads (the cliff consumes the allowance in days), teams that need shared ownership today, anyone who needs auditable pipelines, and cost-sensitive self-hosters. The verdict: the build experience earns the switch for the conversational minority; the credit cliff and the empty multiplayer room send the scheduled-workload majority back.\u003c/p>"}],"journal":[{"n":1,"title":"Session 1 — Day 0b: first contact, unassisted (45 min, timed)","html":"\u003cp>\u003cstrong>Clock start:\u003c/strong> 2026-09-13T16:20:36+05:30 (epoch 1789296636) \u003cstrong>Surface opened:\u003c/strong> \u003ccode>/gumball/chat\u003c/code> (the app's own default landing after login) \u003cstrong>Goal picked:\u003c/strong> get ONE useful thing out of it — a one-page competitive briefing on n8n (rival the research program cares about). Research/summarize only; nothing that leaves the account.\u003c/p>\n\u003ch4>Naive-question log — expectations written BEFORE use\u003c/h4>\n\u003cp>Written cold from names only, before touching anything (the teaching cost is the gap):\u003c/p>\n\u003ctable>\u003cthead>\u003ctr>\u003cth>Object\u003c/th>\u003cth>What I expected it to be (before use)\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Gumball\u003c/td>\u003ctd>A chat assistant, ChatGPT-with-connectors. Named mascot for the whole product.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Brain\u003c/td>\u003ctd>A memory / knowledge base the assistant reads from; I expected to upload docs to it.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Skills\u003c/td>\u003ctd>Capabilities or plugins I'd enable, like a GPTs store — pick from a list.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Artifacts\u003c/td>\u003ctd>Outputs/files the assistants produce, like a documents folder.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Triggers\u003c/td>\u003ctd>Scheduled or event-driven automations, like Zapier triggers.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Tasks\u003c/td>\u003ctd>A run log / queue of executions.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Daily Chew\u003c/td>\u003ctd>A daily digest email/summary of what happened.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\n\u003ch4>Entries\u003c/h4>\n\u003cp>\u003cspan class=\"jt\">\u003cstrong>16:20:36\u003c/strong>\u003cspan class=\"tag t-EXPECT\">EXPECT\u003c/span>\u003c/span> Session start. First surface is \u003ccode>/gumball/chat\u003c/code>, not a dashboard. I expect a blank chat box like ChatGPT; the plan says the greeting matters. Shot \u003ca class=\"evref\" href=\"#/evidence/day0/20\">day0/20-gumball-session-start.png\u003c/a>.\u003c/p>\n\u003cp>\u003cspan class=\"jt\">\u003cstrong>16:21:10\u003c/strong>\u003cspan class=\"tag t-CONFUSED\">CONFUSED\u003c/span>\u003c/span> It is NOT a blank chat. The page greets me by name (\"Good afternoon, Prince\"), then immediately says \"4 highlights need your review\" and shows a right rail stacked with: Daily Chew (with a \"Read full chew\" link), Smart Inbox, Tasks, Artifacts, calendar events, and Highlights with action verbs — RSVP, Dispute, Pay, Confirm. I came to chat; the product came to triage my life. First impression: this is an executive-assistant cockpit, not a chatbot. Shot \u003ca class=\"evref\" href=\"#/evidence/day0/20\">day0/20-gumball-session-start.png\u003c/a>.\u003c/p>\n\u003cp>\u003cstrong>16:22:05 [TRUST-]\u003c/strong> The top Daily Chew item reads: \"[bank-message content redacted]\" On first contact, day one, the product is asking me to confirm a bank mandate and pay a bill from an email that has every hallmark of phishing (long-dated standing instruction to an odd merchant). I will not touch it. But the framing — \"Confirm that mandate\" as a suggested action — is the single most aggressive trust demand I have seen any assistant make in a first session. Journal-only; no interaction. Shot \u003ca class=\"evref\" href=\"#/evidence/day0/20\">day0/20-gumball-session-start.png\u003c/a> (same frame).\u003c/p>\n\u003cp>\u003cspan class=\"jt\">\u003cstrong>16:22:40\u003c/strong>\u003cspan class=\"tag t-EXPECT\">EXPECT\u003c/span>\u003c/span> Now the actual goal. I will ask Gumball for a one-page competitive briefing on n8n — what it is, pricing, strengths, weaknesses, who should pick it over Zapier. I expect: either a fast model-knowledge answer (feels like ChatGPT, low value) or a slow browsed answer with sources (would be the differentiator). I expect to wait 1–3 minutes and get markdown in chat. TTFV clock sub-starts when I hit send.\u003c/p>\n\u003cp>\u003cspan class=\"jt\">\u003cstrong>16:24:45\u003c/strong>\u003cspan class=\"tag t-AHA\">AHA\u003c/span>\u003c/span> The briefing landed, and it is a keeper. Two minutes from send to complete. It browsed — the response is headed \"n8n competitive briefing / Sources: n8n.io, n8n pricing, Zapier pricing. Prices as of 13 Sep 2026\" — and it ran an \"11 Steps\" trace that is visible on the message. Content: what-it-is paragraph, a 5-row pricing table (Community/Starter/Pro/Business/Enterprise with execution limits), the Zapier per-task contrast, 5 strengths, 5 weaknesses, and a crisp \"pick n8n if / stay on Zapier if\" close. This is better than the ChatGPT answer I expected and it is directly usable in our research program. TTFV: \u003cstrong>4 min 09 s from session start; 2 min 00 s from send\u003c/strong>. Shots \u003ca class=\"evref\" href=\"#/evidence/day0/21\">day0/21-message-sent.png\u003c/a>, \u003ca class=\"evref\" href=\"#/evidence/day0/21b\">day0/21b-response-streaming.png\u003c/a>, \u003ca class=\"evref\" href=\"#/evidence/day0/21c\">day0/21c-response-complete.png\u003c/a>.\u003c/p>\n\u003cp>\u003cspan class=\"jt\">\u003cstrong>16:26:20\u003c/strong>\u003cspan class=\"tag t-DELIGHT\">DELIGHT\u003c/span>\u003c/span> Small things that landed: the conversation auto-titled itself \"n8n competitive briefing\" (no \"New chat\" cruft), and the URL became a persistent \u003ccode>/gumball/chat/&lt;id&gt;\u003c/code> link I could bookmark. The response streamed visibly and the steps counter ticked while it worked, so the wait felt like progress, not a spinner.\u003c/p>\n\u003cp>\u003cspan class=\"jt\">\u003cstrong>16:27:05\u003c/strong>\u003cspan class=\"tag t-CONFUSED\">CONFUSED\u003c/span>\u003c/span> What I do NOT see: any action row under the response. No copy button, no regenerate, no \"save as artifact\", no export. The briefing lives in the chat transcript and, as far as the UI shows, nowhere else. For a product whose object model is Agents/Artifacts/Tasks, the one thing every chat produces — text — has no visible path into the Artifacts system. I am going to check the Artifacts and Tasks pages to see if anything was created silently.\u003c/p>\n\u003cp>\u003cspan class=\"jt\">\u003cstrong>16:27:40\u003c/strong>\u003cspan class=\"tag t-FRICTION\">FRICTION\u003c/span>\u003c/span> (economics) The meter barely moved: \"19.9k of 20.0k\" before and after. No per-message cost is shown at send time. Correction from the Tasks page (16:31): the run cost \u003cstrong>52 credits\u003c/strong> (see next entry) — the \"@ 39\" in the conversation header is something else, still unlabeled. [UNPROVEN: what \"@ 39\" labels]\u003c/p>\n\u003cp>\u003cspan class=\"jt\">\u003cstrong>16:31:15\u003c/strong>\u003cspan class=\"tag t-AHA\">AHA\u003c/span>\u003c/span> (object model) Checked Artifacts and Tasks. Artifacts: still empty — \"Artifacts generated by your agents will appear here.\" Nothing from the chat. Tasks: the chat message IS a task — \"n8n competitive briefing | Source: Gumball, Web | 52 credits | Completed | 4 minutes ago\" — sitting under the onboarding's 60-credit scheduled brief. So the model is: \u003cstrong>every Gumball chat message = a Task\u003c/strong> (chat is a task-creation surface, like triggers), and \u003cstrong>Artifacts are a separate, agent-generated thing that chat does not write to\u003c/strong>. My naive expectation for Tasks (\"a run log\") was half right — it is the run log, but I did not expect my chat messages to BE the runs. Felt economics: one browsed research briefing = 52 credits ≈ 0.26% of the free 20k. Shots \u003ca class=\"evref\" href=\"#/evidence/day0/22\">day0/22-artifacts-after-chat.png\u003c/a>, \u003ca class=\"evref\" href=\"#/evidence/day0/23\">day0/23-tasks-after-chat.png\u003c/a>.\u003c/p>\n\u003cp>\u003cspan class=\"jt\">\u003cstrong>16:32:00\u003c/strong>\u003cspan class=\"tag t-EXPECT\">EXPECT\u003c/span>\u003c/span> Follow-up test: I will ask Gumball to save the briefing as an artifact. This tests whether chat output has ANY path into the Artifacts system, or whether artifacts require purpose-built agents. I expect either a refusal-with-explanation or an artifact appearing on the Artifacts page.\u003c/p>\n\u003cp>\u003cspan class=\"jt\">\u003cstrong>16:31:30\u003c/strong>\u003cspan class=\"tag t-AHA\">AHA\u003c/span>\u003c/span> It worked, and better than expected. Gumball ran 13 steps and replied \"Saved as n8n_competitive_briefing.md\", rendering an artifact card inline in chat: \"N8n Competitive Briefing — MD • V1\". The URL gained \u003ccode>?artifact=…&amp;artifact_version=…\u003c/code> — artifacts are deep-linkable and versioned from birth. So chat CAN write to Artifacts; the path just is not advertised on the response (previous [CONFUSED] resolved by asking, not by the UI). Shot \u003ca class=\"evref\" href=\"#/evidence/day0/24c\">day0/24c-response-complete.png\u003c/a>.\u003c/p>\n\u003cp>\u003cspan class=\"jt\">\u003cstrong>16:34:10\u003c/strong>\u003cspan class=\"tag t-FRICTION\">FRICTION\u003c/span>\u003c/span> Verified on the Artifacts page: the artifact is there (\"13 Sept 2026 | N8n Competitive Briefing | MD • V1\"). But: no rename affordance exists on the list or card — the program's zz-rx- prefix cannot be applied, so the artifact keeps its chat-given name and is identified only by the inventory row. Clicking the card did not open a detail view either (URL unchanged); the artifact detail seems reachable only through the chat deep-link. For an object type the product names itself after, Artifacts has the weakest surface of everything I touched today. Shots \u003ca class=\"evref\" href=\"#/evidence/day0/25\">day0/25-artifacts-list.png\u003c/a>, \u003ca class=\"evref\" href=\"#/evidence/day0/26\">day0/26-artifact-open.png\u003c/a>.\u003c/p>\n\u003cp>\u003cspan class=\"jt\">\u003cstrong>16:34:40\u003c/strong>\u003cspan class=\"tag t-FRICTION\">FRICTION\u003c/span>\u003c/span> (economics, corrected) Tasks page now shows the full session ledger: \"Save n8n Briefing Artifact — Web — 23 credits\" on top of \"n8n competitive briefing — Web — 52 credits\". Session total: \u003cstrong>75 credits for one kept one-page briefing plus one artifact save\u003c/strong> (≈0.4% of the free 20k). The unlabeled header numbers (39, then 15) still do not match the task ledger — a small transparency gap. Shot \u003ca class=\"evref\" href=\"#/evidence/day0/29\">day0/29-tasks-after-artifact.png\u003c/a>.\u003c/p>\n\u003cp>\u003cspan class=\"jt\">\u003cstrong>16:35:20\u003c/strong>\u003cspan class=\"tag t-AHA\">AHA\u003c/span>\u003c/span> (proactive layer) Read the full Daily Chew (read-only; no action buttons touched). The Chew is not an email — it is a scheduled chat conversation (\"Brief generation request\", 60 credits, 46 steps, 8:07 am) that renders as a digest: a sourced Catch-up section (the bank item carries footnote markers 1, 2 — it cites sources), the action Highlights, and — the surprise — inline per-section feedback controls: \"You missed a few connectors / I found some highlights unhelpful / Next time can you…\". The digest begs to be corrected. Also visible: the task's own prompt (\"Generate this run's brief now using the run context in your system prompt\") — the proactive layer is inspectable down to its prompt. Shot \u003ca class=\"evref\" href=\"#/evidence/day0/30\">day0/30-full-chew.png\u003c/a>.\u003c/p>\n\u003cp>\u003cstrong>16:36:00 [TRUST-] (closing note on the chew)\u003c/strong> The Chew's Catch-up leads with the bank standing-instruction item phrased as established fact (\"The bank registered…\") with citations, and the Highlights section repeats \"Confirm this mandate\" as an action. A first-contact user who trusts the citations could one-click a financial confirmation derived from a likely-phishing email. The sourcing makes it MORE persuasive, not less. This is the sharpest trust finding of the session: proactive + sourced + action-framed is a powerful and dangerous combination on day one.\u003c/p>\n\u003ch4>Session 1 close\u003c/h4>\n\u003cp>\u003cstrong>Elapsed:\u003c/strong> ~16 min of the 45-minute budget used; goal achieved, stopping early rather than burning budget. \u003cstrong>TTFV:\u003c/strong> 4 min 09 s from first surface open to first kept output; \u003cstrong>2 min 00 s from send\u003c/strong>. TTFA: not applicable (no agent built today — that is Day 1). \u003cstrong>Kept output:\u003c/strong> \u003ccode>n8n_competitive_briefing.md\u003c/code> artifact (MD, V1) + the chat transcript. \u003cstrong>Spend:\u003c/strong> 75 credits (52 research briefing + 23 artifact save). \u003cstrong>Zero real-world actions taken.\u003c/strong> Nothing sent, paid, RSVPed, confirmed, or disputed.\u003c/p>\n\u003ch4>Naive-question log — reality (for objects encountered)\u003c/h4>\n\u003ctable>\u003cthead>\u003ctr>\u003cth>Object\u003c/th>\u003cth>Expected (before use)\u003c/th>\u003cth>Reality (after use)\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Gumball\u003c/td>\u003ctd>Chat assistant, ChatGPT-with-connectors\u003c/td>\u003ctd>An executive-assistant cockpit: chat + proactive triage rail; every message is a Task with credits\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Tasks\u003c/td>\u003ctd>A run log / queue\u003c/td>\u003ctd>The run log — but my own chat messages ARE the tasks (source: Web), each with credits and status\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Artifacts\u003c/td>\u003ctd>Outputs/files folder\u003c/td>\u003ctd>Versioned (V1) typed (MD) objects; chat writes to them only on explicit request; no rename; weak list surface\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Daily Chew\u003c/td>\u003ctd>A digest email\u003c/td>\u003ctd>A scheduled chat task (60 credits, 46 steps) rendering a sourced digest with inline per-section feedback controls\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Brain / Skills / Triggers\u003c/td>\u003ctd>memory / plugins / automations\u003c/td>\u003ctd>Not encountered in use today — carried to Day 1+ [UNPROVEN]\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>"},{"n":2,"title":"Session 2 — Day 1: real work + seeding (compressed program)","html":"\u003cp>\u003cstrong>Note on compression:\u003c/strong> per operator instruction, Days 1–4 run in this single session rather than across calendar days. The account state is \"day-1 steady, already disturbed\" (onboarding + F0 + Day-0b done). Elapsed-time instruments (overnight accrual, next-morning Chew) are compressed to in-session windows and labeled honestly wherever the compression changes what is observable.\u003c/p>\n\u003ch4>Entries\u003c/h4>\n\u003cp>\u003cspan class=\"jt\">\u003cstrong>16:52\u003c/strong>\u003cspan class=\"tag t-EXPECT\">EXPECT\u003c/span>\u003c/span> Day 1 begins. The plan says: do your own actual job, not a template. My real job this week is the competitive-research program itself — and it genuinely needs recurring competitor-pricing monitoring (n8n and Zapier both price-shift). So the real job: build an agent that watches both pricing pages and reports changes per run. I expect: a multi-step builder (name → instructions → schedule), maybe 15–30 minutes, and I expect to get stuck at least once on the trigger UI. TTFA clock starts at the Create Agent click. Shots \u003ca class=\"evref\" href=\"#/evidence/day1/01\">day1/01-agents-baseline.png\u003c/a>, \u003ca class=\"evref\" href=\"#/evidence/day1/02\">day1/02-tasks-baseline.png\u003c/a> (2 agents, 19.9k credits at start).\u003c/p>\n\u003cp>\u003cspan class=\"jt\">\u003cstrong>16:49\u003c/strong>\u003cspan class=\"tag t-DELIGHT\">DELIGHT\u003c/span>\u003c/span> One click and the agent exists. \"Create Agent\" does not open a wizard — it instantly creates a working agent (default name \"Smart Jet\", apparently random) and drops you in a full workspace: New Chat, Artifacts, Reflections, Evaluations, Insights, Chats, External Channels (Email/Slack/Teams/Hosted Page). Zero-to-agent in ~12 seconds, before I had told it anything. The philosophy is the opposite of a form-first builder. Shot \u003ca class=\"evref\" href=\"#/evidence/day1/03\">day1/03-create-agent-landing.png\u003c/a>.\u003c/p>\n\u003cp>\u003cspan class=\"jt\">\u003cstrong>16:51\u003c/strong>\u003cspan class=\"tag t-STEAL\">STEAL\u003c/span>\u003c/span> The fresh agent workspace shows a \"Get started\" nudge with four suggested next steps, in the product's own voice: \"Set up a trigger — I want you to start doing things without me having to ask\", \"Build a live dashboard\", \"Create a skill — I want to teach you how I do things\", \"Personalize yourself\". This is onboarding-by-agent-suggestion, and it teaches the object model (triggers, skills) while selling proactivity. We should steal this pattern verbatim. Shot \u003ca class=\"evref\" href=\"#/evidence/day1/07\">day1/07-settings-panel-open.png\u003c/a>.\u003c/p>\n\u003cp>\u003cspan class=\"jt\">\u003cstrong>16:55\u003c/strong>\u003cspan class=\"tag t-CONFUSED\">CONFUSED\u003c/span>\u003c/span> The workspace has two configuration tabs and the split is not obvious: \"Settings\" holds name/description/personalization/secrets/danger-zone, while \"Agent\" holds the actual brain — instructions, triggers, connectors, skills, knowledge sources, subagents, abilities. I looked for instructions under Settings first and found a dead end. The tab that matters most is named the least descriptively. Shots \u003ca class=\"evref\" href=\"#/evidence/day1/07\">day1/07-settings-panel-open.png\u003c/a>, \u003ca class=\"evref\" href=\"#/evidence/day1/10\">day1/10-agent-tab-panel.png\u003c/a>.\u003c/p>\n\u003cp>\u003cspan class=\"jt\">\u003cstrong>17:00\u003c/strong>\u003cspan class=\"tag t-DELIGHT\">DELIGHT\u003c/span>\u003c/span> The trigger builder is natural-language cron. Four trigger types (Create With AI, App Trigger, Webhook, Scheduled, One-Time); the scheduled form takes \"Every 30 minutes\" as typed text or a chip, has a \"Generate\" button that parses it, and shows the parsed result (\"Every 30 minutes, every hour, every day\"). No cron syntax anywhere. This is the best trigger UX I have used. Shots \u003ca class=\"evref\" href=\"#/evidence/day1/13\">day1/13-scheduled-trigger-form.png\u003c/a>, \u003ca class=\"evref\" href=\"#/evidence/day1/15\">day1/15-schedule-filled.png\u003c/a>.\u003c/p>\n\u003cp>\u003cspan class=\"jt\">\u003cstrong>17:04\u003c/strong>\u003cspan class=\"tag t-FRICTION\">FRICTION\u003c/span>\u003c/span> Minor but real: the trigger drawer's hidden fields came pre-seeded with the \u003cem>existing\u003c/em> Daily Chew trigger's values (\u003ccode>gumloop-chew\u003c/code>, \u003ccode>time_based\u003c/code>, \u003ccode>delayed\u003c/code>) — creating a new trigger shows another trigger's config in the DOM. Harmless here, but it hints at a form-reuse pattern that could confuse state on edge cases. [UNPROVEN: inferred from hidden input values, not visible UI]\u003c/p>\n\u003cp>\u003cspan class=\"jt\">\u003cstrong>17:06\u003c/strong>\u003cspan class=\"tag t-AHA\">AHA\u003c/span>\u003c/span> The watchdog is fully configured: name \u003ccode>zz-rx-competitor-watchdog\u003c/code>, instructions (fetch n8n + Zapier pricing, snapshot, changelog, read-only), and a recurring trigger \u003ccode>zz-rx-pricing-watch\u003c/code> every 30 minutes. Build time from Create click to saved trigger: ~18 minutes, and 4 of those were my own tooling fumbles (case-sensitive button match, placeholder-vs-rendered-text). A human following the \"Get started\" nudges would likely be faster. TTFA pending the first working run — sending it now. Shots \u003ca class=\"evref\" href=\"#/evidence/day1/17\">day1/17-trigger-saved.png\u003c/a>, \u003ca class=\"evref\" href=\"#/evidence/day1/19\">day1/19-instructions-saved.png\u003c/a>.\u003c/p>\n\u003cp>\u003cspan class=\"jt\">\u003cstrong>17:06\u003c/strong>\u003cspan class=\"tag t-AHA\">AHA\u003c/span>\u003c/span> TTFA = 17 min 30 s. First working run of the watchdog: 16 steps, \u003cstrong>45 credits\u003c/strong>, both pricing pages fetched read-only, a \u003ccode>Pricing Snapshot — JSON • V1\u003c/code> artifact saved \u003cem>unprompted\u003c/em> (the instructions asked for it; the Day-0b chat needed an explicit follow-up), and a clean first-run changelog (\"everything is new\") with per-plan prices and the startup-discount notes. The plan's falsifier was \"TTFA &gt; 45 min disconfirms anyone-can-build\": at 17.5 min — with ~4 min of operator fumbles — the build loop passes for a non-ICP operator, n=1. Notably the agent saved its artifact without being asked twice, unlike Gumball chat. Shots \u003ca class=\"evref\" href=\"#/evidence/day1/20\">day1/20-run-message-sent.png\u003c/a>, \u003ca class=\"evref\" href=\"#/evidence/day1/21\">day1/21-run-response-streaming.png\u003c/a>, \u003ca class=\"evref\" href=\"#/evidence/day1/22\">day1/22-run-complete.png\u003c/a>.\u003c/p>\n\u003cp>\u003cspan class=\"jt\">\u003cstrong>17:06\u003c/strong>\u003cspan class=\"tag t-AHA\">AHA\u003c/span>\u003c/span> (memory) Gave Gumball standing context (\"I run a competitive-research program on AI agent platforms… I track Gumloop, n8n, Zapier, Lindy, Dust\"). Its reply: \"Live pricing confirmed. Here's the one-page briefing, \u003cstrong>same format as the n8n one\u003c/strong>\" — and it produced a full Lindy competitive briefing, sourced live (lindy.ai, pricing, docs, Trustpilot, reviews), in exactly the Day-0b n8n format, ending with \"Want me to save this as a file, or fold it into a running comparison doc across the platforms you track?\" It remembered the format of a briefing from a \u003cem>different conversation\u003c/em> yesterday-session and proactively applied it to a competitor I only mentioned in passing. Cross-conversation memory is real and immediately useful. 13 steps, 9 credits. Shot \u003ca class=\"evref\" href=\"#/evidence/day1/23\">day1/23-gumball-context.png\u003c/a> (transcript in \u003ccode>app-text/day1/34-captcha-challenge.txt\u003c/code>).\u003c/p>\n\u003cp>\u003cspan class=\"jt\">\u003cstrong>17:08\u003c/strong>\u003cspan class=\"tag t-FRICTION\">FRICTION\u003c/span>\u003c/span> (verbosity) Q1 \"What's the difference between Zapier and Make?\" came back at ~3,800 chars — a full comparison table with live pricing when I asked a one-line question. Useful once, exhausting as a default. Sent the correction: \"Too long. Under 50 words, no preamble.\" Shot \u003ca class=\"evref\" href=\"#/evidence/day1/24\">day1/24-q1-answer.png\u003c/a>.\u003c/p>\n\u003cp>\u003cspan class=\"jt\">\u003cstrong>17:10\u003c/strong>\u003cspan class=\"tag t-DELIGHT\">DELIGHT\u003c/span>\u003c/span> (correction obeyed) The correction worked instantly: the re-answer was 43 words, no preamble, actually better than the long one. The correction pattern is seeded (this is the learned-skills test — same correction, same way, repeated). Shot \u003ca class=\"evref\" href=\"#/evidence/day1/35\">day1/35-correction-resend.png\u003c/a>.\u003c/p>\n\u003cp>\u003cspan class=\"jt\">\u003cstrong>17:15\u003c/strong>\u003cspan class=\"tag t-CONFUSED\">CONFUSED\u003c/span>\u003c/span> (false alarm, recorded honestly) Mid-session, chat sends appeared to hang and I suspected bot-detection — hCaptcha iframes are embedded on the chat and tasks pages. On retry the send went through fine; the iframes are passive preloads, and my poll window had simply been shorter than Gumball's \"Choosing the best model…\" latency. No challenge was ever shown. Operator error, not product friction — but the \u003cem>feeling\u003c/em> of \"am I being captcha'd?\" after 90 minutes of rapid scripted interaction is worth noting: heavy users will hit this question too. [UNPROVEN: no active challenge was ever observed]\u003c/p>\n\u003cp>\u003cspan class=\"jt\">\u003cstrong>17:22\u003c/strong>\u003cspan class=\"tag t-AHA\">AHA\u003c/span>\u003c/span> (correction sticks) The learned-skills seed: after ONE correction (\"Too long. Under 50 words, no preamble.\"), Gumball's next two answers — \"What is Dust?\" and \"What is Relevance AI?\", in a fresh conversation — both came back at ~560 chars (~80 words), no correction needed. Confounded (simple \"what is X\" questions invite shorter answers than comparison questions), so this is suggestive, not proof. The real H6 test is whether an unprompted Skill appears on the Skills page — checked at Day 2+. Shots \u003ca class=\"evref\" href=\"#/evidence/day1/37\">day1/37-q2-answer.png\u003c/a>, \u003ca class=\"evref\" href=\"#/evidence/day1/39\">day1/39-q3-answer.png\u003c/a>.\u003c/p>\n\u003cp>\u003cspan class=\"jt\">\u003cstrong>17:24\u003c/strong>\u003cspan class=\"tag t-CONFUSED\">CONFUSED\u003c/span>\u003c/span> (Brain) The Brain has no native note type. \"Add a source\" opens a connector catalog: Essentials (Notion, Drive, Gmail, Slack, GitHub, Confluence, Zendesk, Gong, Linear, Salesforce), File uploads, Gumloop Artifacts, and a \"Build your own\" wall of hundreds of MCP-style connectors (Actively to Zoom — Ahrefs, Airtable, Stripe, Shopify, X, YouTube…). Knowledge enters through sync or upload, never by typing. For a product called Brain, you cannot think into it directly. Shots \u003ca class=\"evref\" href=\"#/evidence/day1/30\">day1/30-brain-day1.png\u003c/a>, \u003ca class=\"evref\" href=\"#/evidence/day1/31\">day1/31-brain-add-open.png\u003c/a>.\u003c/p>\n\u003cp>\u003cspan class=\"jt\">\u003cstrong>17:26\u003c/strong>\u003cspan class=\"tag t-DELIGHT\">DELIGHT\u003c/span>\u003c/span> (Brain, credit transparency) Uploaded the research-program context as a file source. Before syncing, the Brain showed a full approval panel: documents found (1), to sync (1), and an \u003cstrong>estimated cost: ~5 credits\u003c/strong>, with the caveat \"Documents that update frequently are re-synced later and can add up in credits over time.\" This is the first place in the product that shows a price BEFORE an action rather than in the task ledger after. Every credit-consuming surface should work this way. Shots \u003ca class=\"evref\" href=\"#/evidence/day1/40\">day1/40-brain-credit-estimate.png\u003c/a>, \u003ca class=\"evref\" href=\"#/evidence/day1/41\">day1/41-brain-source-synced.png\u003c/a>.\u003c/p>\n\u003cp>\u003cspan class=\"jt\">\u003cstrong>17:25\u003c/strong>\u003cspan class=\"tag t-EXPECT\">EXPECT\u003c/span>\u003c/span> Seeded the last long-runner: \u003ccode>zz-rx-half-finished\u003c/code> (/agents/sK6SEfpd5PpiWqYB95GYxg) — created, named, described, and deliberately left with no instructions and no trigger. The workspace immediately showed its own \"Get started\" nudge (trigger / dashboard / skill / personalize). The test: does the product notice the abandonment over time — in the Chew, home, or notifications — or only inside the workspac
